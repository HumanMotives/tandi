<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOTANICA — Natural Sequencer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Space+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#E8E4DA;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Space Mono',monospace;padding:16px;user-select:none;
}
.status{display:flex;gap:14px;justify-content:center;font-size:8px;letter-spacing:.12em;color:#5A5A52;margin-bottom:8px;}
.dot{width:5px;height:5px;border-radius:50%;background:#3A3A32;display:inline-block;margin-right:3px;vertical-align:middle;transition:background .2s;}
.dot.on{background:#8BAA7A;}.dot.err{background:#C47A5A;}
.warn{display:none;background:#3A2A20;border:1px solid #C47A5A;border-radius:4px;padding:5px 12px;font-size:8px;color:#C47A5A;text-align:center;margin-bottom:6px;max-width:860px;}

.panel{position:relative;width:860px;overflow:hidden;border-radius:20px;}
@media(max-width:900px){.panel{width:100%;max-width:860px;} body{padding:8px;}}
.panel-img{width:100%;display:block;border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.65);}

.knob{position:absolute;transform:translate(-50%,-50%);cursor:ns-resize;display:flex;flex-direction:column;align-items:center;gap:0;}
.knob-label{display:none;}
.knob-val{display:none;}

.btn{position:absolute;transform:translate(-50%,-50%);background:#B8A96A;border:1px solid #A69857;color:#1A1A18;

.btn:hover{background:#C6B87A;}
.btn.active{background:#7c7f47;border-color:#63653a;color:#F2EFE6;}
.btn.locked{background:#8BAA7A;border-color:#6F8E62;color:white;}
.btn.muted{background:#C47A5A;border-color:#A6613F;color:white;}

.led{position:absolute;width:9px;height:9px;border-radius:50%;background:#D8D2C0;border:1px solid #B0A98F;
  transform:translate(-50%,-50%);transition:background .15s,box-shadow .15s;
  box-shadow:0 1px 1px rgba(0,0,0,.2) inset;}
.led.on{background:#F0A840;box-shadow:0 0 7px #F0A840,0 0 2px #F0A840 inset;border-color:#C4822C;}

.seasonpill{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;padding:4px 0;
  background:#B8A96A44;border:1px solid #B8A96A88;border-radius:12px;font-size:7px;letter-spacing:.06em;color:#5A5340;
  pointer-events:none;transition:all .15s;font-weight:700;}
.seasonpill.active{background:#B8A96A;color:#1A1A18;border-color:#B8A96A;box-shadow:0 1px 2px rgba(0,0,0,.2);}

.display{position:absolute;top:54.4%;left:50%;transform:translate(-50%,-50%);background:#1A1A18;border-radius:6px;
  width:100px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px solid #B8A96A;pointer-events:none;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.dv{font-size:18px;color:#B8A96A;letter-spacing:.06em;line-height:1;}
.dl{font-size:5px;letter-spacing:.18em;color:#6A6558;margin-top:2px;}

.pat-disp-outer{font-size:11px;color:#B8A96A;letter-spacing:.08em;background:#080806;border-radius:5px;padding:5px 16px;
  margin-bottom:6px;text-align:center;width:860px;white-space:nowrap;}

.log{width:860px;background:#080806;border-radius:5px;padding:4px 12px;height:30px;overflow:hidden;font-size:7px;color:#B8A96A;letter-spacing:.06em;margin-top:6px;}
.ll{opacity:.45;line-height:1.7;}.ll:last-child{opacity:1;}

.edit-mode-btn{position:fixed;top:10px;right:10px;z-index:1000;background:#B8A96A;border:none;color:#1A1A18;
  border-radius:4px;padding:6px 14px;cursor:pointer;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.14em;font-weight:700;}
.edit-overlay{display:none;position:fixed;top:10px;left:10px;z-index:1000;background:rgba(8,8,6,.92);border:1px solid #B8A96A;
  border-radius:6px;padding:10px 14px;font-size:8px;color:#B8A96A;letter-spacing:.08em;max-width:280px;line-height:1.9;}
.edit-overlay.on{display:block;}
.edit-coords{font-size:9px;color:#B8A96A;margin-top:4px;font-weight:700;}
body.editing .knob{cursor:grab!important;outline:2px dashed rgba(184,169,106,.4);border-radius:50%;}
body.editing .btn{cursor:grab!important;outline:1px dashed rgba(184,169,106,.4);}
body.editing .btn:hover{outline:1px solid #B8A96A;}
body.editing .knob:hover{outline:2px solid #B8A96A;}
body.editing .knob:active{cursor:grabbing!important;}
</style>

<div style="font-size:7px;letter-spacing:.1em;color:#7A7A72;text-align:center;margin-top:5px;">v2.0-browser · © 2026 CHRIS VAN DER LINDEN · HUMAN MOTIVES</div>

<script>
// ============================================================
//  BOTANICA v2 — Browser prototype matched to Teensy firmware
//  (BOTANICA DEV 3 state: PSEED = mask-only, TSEED = direct,
//   Chord/Arp target Blossoms only, 5-zone REFRACT)
// ============================================================

const CORE={bpm:120,get stepMs(){return 60000/(this.bpm*4);},running:false,timer:null};

// REFRACT — 5 zones per roadmap TODO: ÷4 ÷2 ×1 ×2 ×4
const TOPOLOGY={
  index:2,labels:['-4','-2','x1','+2','+4'],factors:[0.25,0.5,1,2,4],
  subMs(idx){return CORE.stepMs/this.factors[idx];}
};

const SCALES=[[0,2,4,7,9],[0,2,4,6,7,9,11],[0,2,3,5,7,9,10],[0,2,4,6,8,10]];
const S_ROOTS=[60,67,57,62];
const S_LABELS=['SP','SU','FA','WI'];
const S_NAMES=['Pentatonic Maj (SPRING)','Lydian (SUMMER)','Dorian (FALL)','Whole Tone (WINTER)'];
const NNAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const SEASON={
  index:0,transpose:0,octaveRange:2,
  root(){return S_ROOTS[this.index]+this.transpose;},
  scale(){return SCALES[this.index];},
  randomNote(){
    const sc=this.scale(),r=this.root();
    return Math.max(0,Math.min(127,r+Math.floor(Math.random()*this.octaveRange)*12+sc[Math.floor(Math.random()*sc.length)]));
  },
  clampToRange(midi){
    const sc=this.scale(),r=this.root();
    const sem=((midi-r)%12+12)%12;
    let best=sc[0],bd=99;
    for(const d of sc){const dist=Math.abs(d-sem);if(dist<bd){bd=dist;best=d;}}
    return Math.max(0,Math.min(127,r+Math.max(0,Math.min(this.octaveRange-1,Math.floor((midi-r)/12)))*12+best));
  },
  quantize(midi){
    const sc=this.scale(),r=this.root();
    const sem=((midi-r)%12+12)%12;
    let best=sc[0],bd=99;
    for(const d of sc){const dist=Math.abs(d-sem);if(dist<bd){bd=dist;best=d;}}
    return Math.max(0,Math.min(127,r+Math.floor((midi-r)/12)*12+best));
  },
  scaleStepUp(midi){
    const sc=this.scale(),r=this.root();
    const sem=((midi-r)%12+12)%12;
    let idx=0;for(let i=0;i<sc.length;i++) if(sc[i]<=sem) idx=i;
    const nIdx=(idx+1)%sc.length;
    return Math.max(0,Math.min(127,midi-sc[idx]+sc[nIdx]+(sc[nIdx]<sc[idx]?12:0)));
  }
};

// ── PRUNE ── main knob is a static right-to-left mask (firmware: deterministic).
// PRUNE-MOD = the RND trimpot: chance per-cycle to swap in a random alternate shape.
const PRUNE={
  value:1.0, mod:0, activeValue:1.0, mask:new Array(16).fill(true),
  generate(len){
    this.mask=new Array(16).fill(true);
    const v=this.activeValue;
    if(v>=0.99) return;
    const keep=Math.max(1,Math.round(len*v));
    // deterministic right-to-left removal (matches firmware default), unless
    // a PATTERN SEED has produced an alternate shape (see PSEED.shapeSeed)
    for(let i=0;i<len-keep;i++) this.mask[(len-1-i)]=PSEED.shapeSeed[len-1-i]!==undefined?PSEED.shapeSeed[len-1-i]:false;
  },
  tick(len){
    if(SEQ.patternLocked) return;
    if(this.mod>0.02 && Math.random()<this.mod) this.activeValue=Math.random();
    else this.activeValue=this.value;
    this.generate(len);
  },
  allows(step){return this.mask[step%16];}
};

// ── PATTERN SEED (PSEED) ── non-destructive: does NOT touch gates/HITS/LENGTH.
// Regenerates: (1) an alternate prune shape used when PRUNE-MOD fires,
// (2) which steps are tie-candidates (only audible if TIES is on),
// (3) the FILL/ghost-note order (not modeled in this prototype — flagged).
const PSEED={
  shapeSeed:new Array(16).fill(true),
  tieCandidates:new Array(16).fill(false),
  seed(){
    // alternate prune shape: random subset kept, instead of strict right-to-left
    const pos=[...Array(16).keys()];
    for(let i=pos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]];}
    this.shapeSeed=new Array(16).fill(false);
    const keepCount=Math.round(16*0.6);
    for(let i=0;i<keepCount;i++) this.shapeSeed[pos[i]]=true;
    // tie candidates: ~30% of steps become eligible to be tied
    this.tieCandidates=new Array(16).fill(false).map(()=>Math.random()<0.3);
    PRUNE.generate(SEQ.len);
  }
};

const TIES={
  on:false,
  // returns true if this step should extend the previous note instead of
  // retriggering — only has any effect while TIES is on, and only for
  // steps PATTERN SEED marked as tie-candidates.
  shouldTie(step){ return this.on && PSEED.tieCandidates[step%16]; }
};

const EVOLVE={
  chance:0,stepCount:0,
  tick(){
    if(this.chance<0.01) return;
    if(++this.stepCount>=Math.max(1,Math.round(1/this.chance))){
      this.stepCount=0;
      const t=Math.floor(Math.random()*SEQ.len);
      const n=SEASON.randomNote();
      SEQ.rawPitchMemory[t]=n;SEQ.pitchMemory[t]=SEASON.quantize(n);
      updatePD();lg('↻ tone evolve');
    }
  }
};

const DRIFT={value:0}; // 0-50%=timing offset, 50-100%=groove shift

const BLOSSOM={
  amount:0,rampMode:'down',pitchMode:'none',attack:0,reps:3,refractMod:0,
  activeRefractIdx:2,
  tickRnd(){
    if(this.refractMod>0.02 && Math.random()<this.refractMod) this.activeRefractIdx=Math.floor(Math.random()*TOPOLOGY.factors.length);
    else this.activeRefractIdx=TOPOLOGY.index;
  },
  fire(rootPitch,rootVel){
    if(this.amount<0.02||Math.random()>this.amount) return;
    const minMidi=SEASON.root(),maxMidi=minMidi+SEASON.octaveRange*12-1;
    const baseMs=CORE.stepMs;
    const clamp=p=>{while(p>maxMidi)p-=12;while(p<minMidi)p+=12;return Math.max(0,Math.min(127,p));};
    for(let i=0;i<this.reps;i++){
      const gen=i,rm=this.rampMode,pm=this.pitchMode,rp=this.reps;
      const eMs=TOPOLOGY.subMs(this.activeRefractIdx);
      const t=this.attack*baseMs+eMs*(gen+1);
      const vel=rm==='up'?Math.max(4,Math.floor(rootVel*Math.pow(0.55,rp-gen))):Math.max(4,Math.floor(rootVel*Math.pow(0.55,gen+1)));
      let notes=[rootPitch];
      // ARP/CHORD only ever apply here — Blossom layer, never Hits.
      if(MODE.chordArp===2){
        // ARP: single note, steps up through the scale each repetition
        let p=rootPitch;for(let s=0;s<gen+1;s++) p=SEASON.scaleStepUp(p);
        notes=[p];
      } else if(MODE.chordArp===1){
        // CHORD: triad (root, 3rd, 5th scale-degree), all notes together per repetition
        let third=rootPitch;for(let s=0;s<2;s++) third=SEASON.scaleStepUp(third);
        let fifth=rootPitch;for(let s=0;s<4;s++) fifth=SEASON.scaleStepUp(fifth);
        notes=[rootPitch,third,fifth];
      } else if(pm==='octdown') notes=[rootPitch-12*(gen+1)];
      else if(pm==='octup')   notes=[rootPitch+12*(gen+1)];
      const sd=eMs*.45;
      notes.forEach(p=>{
        const sp=clamp(p),sv=vel;
        setTimeout(()=>{if(!CORE.running||SEQ.mute)return;MIDI.noteOn(sp,sv,1);PLUCK.play(sp,sv);setTimeout(()=>MIDI.noteOff(sp,1),sd);},t);
      });
    }
  }
};

// MODE (TMODE=Chord) / ARP (TARP) — mutually exclusive, both target Blossoms only
const MODE={
  chordArp:0, // 0=off 1=Chord 2=Arp
};

const ENV={on:false}; // simplified SEQ/SYN toggle: repurposes OFFSET/DECAY as synth Attack/Decay

const SEQ={
  len:8,hits:4,step:0,patternLocked:false,mute:false,
  gateMemory:new Array(16).fill(false),
  pitchMemory:new Array(16).fill(60),
  rawPitchMemory:new Array(16).fill(60),
  activeNotes:{},lastPitch:60,
  get gates(){return this.gateMemory.slice(0,this.len);},
  get pitches(){return this.pitchMemory.slice(0,this.len).map(p=>SEASON.clampToRange(p));},
  // Gates are ALWAYS Euclidean over MAX_STEPS (16) — firmware seqGenGates().
  // LENGTH is a playback window, HITS is a live mask. Neither destroys the seed.
  genGates(){
    for(let i=0;i<16;i++) this.gateMemory[i]=((i*this.hits/16)|0)!==(((i+1)*this.hits/16)|0);
  },
  genPitches(){
    const sc=SEASON.scale(),r=SEASON.root(),range=SEASON.octaveRange;
    const pos=[...Array(16).keys()];
    for(let i=pos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]];}
    for(let o=0;o<range&&o<16;o++){const d=Math.floor(Math.random()*sc.length);this.rawPitchMemory[pos[o]]=Math.max(0,Math.min(127,r+o*12+sc[d]));}
    for(let i=range;i<16;i++) this.rawPitchMemory[pos[i]]=SEASON.randomNote();
    this.pitchMemory=this.rawPitchMemory.map(p=>SEASON.quantize(p));
  },
  play(n,v,d,ch){
    if(this.activeNotes[n]) clearTimeout(this.activeNotes[n]); else MIDI.noteOn(n,v,ch);
    this.activeNotes[n]=setTimeout(()=>{MIDI.noteOff(n,ch);delete this.activeNotes[n];},d);
  },
  allOff(){for(const n in this.activeNotes){MIDI.noteOff(parseInt(n),1);}this.activeNotes={};}
};

const MIDI={
  out:null,
  noteOn(n,v,ch){if(!this.out||SEQ.mute||n<0||n>127)return;this.out.send([0x8F+ch,n,Math.max(1,Math.min(127,v))]);},
  noteOff(n,ch){if(!this.out||n<0||n>127)return;this.out.send([0x7F+ch,n,0]);}
};

async function initMIDI(){
  if(!navigator.requestMIDIAccess){document.getElementById('warn').style.display='block';dot('midi','err');return;}
  try{
    const ma=await navigator.requestMIDIAccess();
    dot('midi','on');document.getElementById('t-midi').textContent='MIDI OK';
    function populateSelect(){
      const sel=document.getElementById('midi-select');
      const outputs=[...ma.outputs.values()];
      const curId=sel.value;
      sel.innerHTML='<option value="">— MIDI OUT —</option>';
      outputs.forEach(o=>{const opt=document.createElement('option');opt.value=o.id;opt.textContent=o.name.substring(0,24);sel.appendChild(opt);});
      if(curId && ma.outputs.get(curId)) sel.value=curId;
      else if(outputs.length){sel.value=outputs[0].id;MIDI.out=outputs[0];document.getElementById('t-out').textContent='→ '+outputs[0].name.substring(0,14);dot('out','on');lg('MIDI: '+outputs[0].name);}
    }
    populateSelect(); ma.onstatechange=()=>populateSelect(); window._midiAccess=ma;
  }catch(e){document.getElementById('warn').style.display='block';dot('midi','err');}
}
function selectMidiOut(id){
  if(!window._midiAccess||!id) return;
  const out=window._midiAccess.outputs.get(id);
  if(out){MIDI.out=out;document.getElementById('t-out').textContent='→ '+out.name.substring(0,14);dot('out','on');lg('MIDI out: '+out.name);}
}

function startSeq(){
  if(CORE.running) return;
  PLUCK.init();
  CORE.running=true;SEQ.step=0;EVOLVE.stepCount=0;
  dot('clk','on');document.getElementById('t-clk').textContent='RUNNING';tick();
}
function stopSeq(){
  CORE.running=false;if(CORE.timer) clearTimeout(CORE.timer);SEQ.allOff();
  dot('clk','');document.getElementById('t-clk').textContent='STOPPED';
}
function tick(){
  if(!CORE.running) return;
  const stepMs=CORE.stepMs,step=SEQ.step%SEQ.len;
  const gates=SEQ.gates,pitches=SEQ.pitches;
  const hitsMaskOk = step < SEQ.hits ? true : true; // HITS already baked into genGates via 16-slot euclid + LENGTH window
  if(gates[step]&&PRUNE.allows(step)){
    const pitch=pitches[step],vel=Math.floor(68+Math.random()*20);
    let slop=0,swapStep=step;
    if(DRIFT.value<=0.5) slop=Math.max(0,DRIFT.value*2*stepMs*.35*Math.random());
    else if(Math.random()<(DRIFT.value-0.5)*2*0.3) swapStep=(step+1)%SEQ.len; // groove shift
    setTimeout(()=>{
      if(!CORE.running||SEQ.mute) return;
      if(TIES.shouldTie(step)&&SEQ.activeNotes[SEQ.lastPitch]){
        // extend previous note instead of retriggering
        clearTimeout(SEQ.activeNotes[SEQ.lastPitch]);
        SEQ.activeNotes[SEQ.lastPitch]=setTimeout(()=>{MIDI.noteOff(SEQ.lastPitch,1);delete SEQ.activeNotes[SEQ.lastPitch];},stepMs*.9);
      } else {
        SEQ.play(pitch,vel,stepMs*.35,1);
        SEQ.lastPitch=pitch;
      }
      showDisp(NNAMES[((pitch%12)+12)%12]+Math.floor(pitch/12-1));
      BLOSSOM.fire(pitch,vel);
    },slop);
  }
  SEQ.step=(SEQ.step+1)%SEQ.len;
  if(SEQ.step===0){EVOLVE.tick();PRUNE.tick(SEQ.len);BLOSSOM.tickRnd();}
  updatePD();
  CORE.timer=setTimeout(tick,Math.max(10,stepMs));
}

let dispTimer=null;
function showDisp(l){
  document.getElementById('dv').textContent=l;document.getElementById('dl').textContent='';
  if(dispTimer) clearTimeout(dispTimer);
  dispTimer=setTimeout(()=>{document.getElementById('dv').textContent=S_LABELS[SEASON.index];document.getElementById('dl').textContent='SEASON';},2000);
}
function updatePD(){
  const el=document.getElementById('dv-pat');if(!el)return;
  el.textContent=SEQ.gates.map((g,i)=>g?(PRUNE.allows(i)?NNAMES[((SEQ.pitches[i]||60)%12+12)%12]:'·'):'·').join(' ');
}
function dot(id,st){const d=document.getElementById('d-'+id);if(d) d.className='dot'+(st==='on'?' on':st==='err'?' err':'');}
function lg(msg){const l=document.getElementById('log');if(!l)return;const d=document.createElement('div');d.className='ll';d.textContent=msg;l.appendChild(d);while(l.children.length>3) l.removeChild(l.firstChild);}

function setSeason(i){
  SEASON.index=i;
  for(let j=0;j<4;j++) document.getElementById('sp-'+j).classList.toggle('active',j===i);
  SEQ.pitchMemory=SEQ.rawPitchMemory.map(p=>SEASON.quantize(p));
  updatePD();showDisp(S_LABELS[i]);lg('Season: '+S_NAMES[i]);
}

// PATTERN SEED — non-destructive, mirrors PSEED: touches Prune-shape, Tie

function patternSeed(){

  PSEED.seed();
  updatePD();
  showDisp('SEED');

  lg(audible ? '⟳ pattern seed (audible now)' : '⟳ pattern seed — silent until PRUNE-MOD or TIES is on');
}

// KNOB FACTORY
function makeKnob(cfg){
  const el=document.getElementById(cfg.id);if(!el) return;
  const sz=cfg.size||44,r=sz/2-4,cx=sz/2,cy=sz/2;
  let val=cfg.val;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',sz);svg.setAttribute('height',sz);svg.setAttribute('viewBox',`0 0 ${sz} ${sz}`);
  const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',r);
  bg.setAttribute('fill','rgba(8,8,6,.88)');bg.setAttribute('stroke','#ffffff');bg.setAttribute('stroke-width','3');
  const mk=document.createElementNS('http://www.w3.org/2000/svg','line');
  mk.setAttribute('x1',cx);mk.setAttribute('y1',cy);
  mk.setAttribute('stroke','#B8A96A');mk.setAttribute('stroke-width','2.5');mk.setAttribute('stroke-linecap','round');
  svg.appendChild(bg);svg.appendChild(mk);
  const lbl=document.createElement('div');lbl.className='knob-label';lbl.textContent=cfg.label;
  el.appendChild(svg);el.appendChild(lbl);
  function setMk(v){
    const pct=(v-cfg.min)/(cfg.max-cfg.min);
    const a=(-135+pct*270)*Math.PI/180;
    mk.setAttribute('x2',cx+Math.sin(a)*r);mk.setAttribute('y2',cy-Math.cos(a)*r);
  }
  let drag=false,sy=0,sv=0;
  el.addEventListener('mousedown',e=>{
    if(editMode) return;
    drag=true;sy=e.clientY;sv=val;e.preventDefault();
    const mm=ev=>{if(!drag||editMode)return;val=Math.max(cfg.min,Math.min(cfg.max,sv+(sy-ev.clientY)*(cfg.max-cfg.min)/120));setMk(val);cfg.fn(val);};
    const mu=()=>{drag=false;document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
  setMk(val);cfg.fn(val);
}

function buildKnobs(){
  [
    {id:'k-hits',       label:'HITS',    min:1,max:16,val:4, size:34, fn(v){SEQ.hits=Math.round(v);if(!SEQ.patternLocked)SEQ.genGates();updatePD();}},
    {id:'k-length',     label:'LENGTH',  min:1,max:16,val:8, size:34, fn(v){SEQ.len=Math.round(v);updatePD();}},
    {id:'k-prune',      label:'PRUNE',   min:0,max:100,val:0,size:56, fn(v){PRUNE.value=1-(v/100);PRUNE.generate(SEQ.len);}},
    {id:'k-prunemod',   label:'MOD',     min:0,max:100,val:0, size:34, fn(v){PRUNE.mod=v/100;}},
    {id:'k-drift',      label:'DRIFT',   min:0,max:100,val:0, size:56, fn(v){DRIFT.value=v/100;}},
    {id:'k-evolve',     label:'EVOLVE',  min:0,max:100,val:0, size:56, fn(v){EVOLVE.chance=v/100;}},
    {id:'k-blossom',    label:'BLOSSOM', min:0,max:100,val:0, size:56, fn(v){BLOSSOM.amount=v/100;}},
    {id:'k-refract',    label:'REFRACT', min:0,max:4,val:2,  size:56, fn(v){TOPOLOGY.index=Math.round(v);BLOSSOM.activeRefractIdx=Math.round(v);}},
    {id:'k-refractmod', label:'MOD',     min:0,max:100,val:0, size:34, fn(v){BLOSSOM.refractMod=v/100;}},
    {id:'k-decay',      label:'DECAY',   min:1,max:16,val:3,  size:34, fn(v){BLOSSOM.reps=Math.round(v);}},
    {id:'k-offset',     label:'OFFSET',  min:0,max:8,val:0,   size:34, fn(v){BLOSSOM.attack=Math.round(v);}},
    {id:'k-root',       label:'ROOT',    min:-48,max:48,val:0,size:56, fn(v){SEASON.transpose=Math.round(v);SEQ.pitchMemory=SEQ.rawPitchMemory.map(p=>SEASON.quantize(p));updatePD();}},
    {id:'k-range',      label:'RANGE',   min:1,max:6,val:2,   size:56, fn(v){SEASON.octaveRange=Math.round(v);updatePD();}},
  ].forEach(cfg=>makeKnob(cfg));
}

// ─── EDIT MODE ───────────────────────────────
let editMode=false;
function toggleEditMode(){
  editMode=!editMode;
  document.body.classList.toggle('editing',editMode);
  document.getElementById('edit-overlay').classList.toggle('on',editMode);
  document.querySelector('.edit-mode-btn').textContent=editMode?'✕ EXIT EDIT':'⊹ EDIT MODE';
  if(editMode) setupEditDrag();
}
function setupEditDrag(){
  const panel=document.getElementById('panel');
  const panelRect=()=>panel.getBoundingClientRect();
  document.querySelectorAll('.knob, .btn, .display, .seasonpill').forEach(el=>{
    if(el._editDrag) return; el._editDrag=true;
    let didDrag=false;
    el.addEventListener('click',e=>{if(didDrag){e.stopPropagation();e.preventDefault();didDrag=false;}},true);
    el.addEventListener('mousedown',e=>{
      if(!editMode) return;
      e.preventDefault();e.stopPropagation();didDrag=false;
      const pr=panelRect();
      const startX=e.clientX,startY=e.clientY;
      const startLeft=parseFloat(el.style.left),startTop=parseFloat(el.style.top);
      document.getElementById('edit-last').textContent='dragging: '+el.id;
      function onMove(ev){
        didDrag=true;
        const dx=ev.clientX-startX,dy=ev.clientY-startY;
        const newLeft=Math.max(0,Math.min(100,startLeft+(dx/pr.width)*100));
        const newTop=Math.max(0,Math.min(100,startTop+(dy/pr.height)*100));
        el.style.left=newLeft.toFixed(1)+'%';el.style.top=newTop.toFixed(1)+'%';
        document.getElementById('edit-coords').textContent=el.id+'\ntop:'+newTop.toFixed(1)+'% left:'+newLeft.toFixed(1)+'%';
      }
      function onUp(){
        document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
        const finalLeft=parseFloat(el.style.left).toFixed(1),finalTop=parseFloat(el.style.top).toFixed(1);
        document.getElementById('edit-coords').textContent=el.id+': top:'+finalTop+'% left:'+finalLeft+'%';
        navigator.clipboard?.writeText(`top:${finalTop}%;left:${finalLeft}%`);
        document.getElementById('edit-last').textContent='✓ copied: '+el.id;
      }
      document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    });
  });
}

// ─── WEBAUDIO PLUCK SYNTH ────────────
const PLUCK={
  ctx:null, enabled:true,
  init(){ if(this.ctx) return; this.ctx=new(window.AudioContext||window.webkitAudioContext)(); },
  play(midiNote,velocity){
    if(!this.enabled||!this.ctx) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    const freq=440*Math.pow(2,(midiNote-69)/12);
    const vel=velocity/127;
    const now=this.ctx.currentTime;
    const attack = ENV.on ? Math.max(0.001, BLOSSOM.attack/16) : 0.001;
    const decayT = ENV.on ? Math.max(0.05, BLOSSOM.reps/8) : 1.4;
    const buf=this.ctx.createBuffer(1,Math.floor(this.ctx.sampleRate*0.04),this.ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=freq*5;
    const ng=this.ctx.createGain(); ng.gain.setValueAtTime(vel*.07,now); ng.gain.exponentialRampToValueAtTime(.001,now+.04);
    src.connect(lp); lp.connect(ng);
    const osc=this.ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vel*.5,now+attack); g.gain.exponentialRampToValueAtTime(.001,now+attack+decayT);
    osc.connect(g);
    const osc2=this.ctx.createOscillator(); osc2.type='sine'; osc2.frequency.value=freq*2.005;
    const g2=this.ctx.createGain(); g2.gain.setValueAtTime(vel*.12,now); g2.gain.exponentialRampToValueAtTime(.001,now+.35);
    osc2.connect(g2);
    const master=this.ctx.createGain(); master.gain.value=.75; master.connect(this.ctx.destination);
    ng.connect(master); g.connect(master); g2.connect(master);
    src.start(now); src.stop(now+.05);
    osc.start(now); osc.stop(now+attack+decayT+.2);
    osc2.start(now); osc2.stop(now+.4);
  }
};
const _origPlay=SEQ.play.bind(SEQ);
SEQ.play=function(note,vel,dur,ch){ _origPlay(note,vel,dur,ch); PLUCK.play(note,vel); };
