<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HAZE</title>
<meta name="description" content="HAZE — generative ambient sound that never repeats. Best with headphones." />
<meta name="theme-color" content="#eef0ea" />
<meta property="og:title" content="HAZE" />
<meta property="og:description" content="Generative ambient sound that never repeats. Best with headphones." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23c4d6d0'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #eef0ea;
    -webkit-tap-highlight-color: transparent;
  }
  #field {
    position: fixed;
    inset: 0;
  }
  #fieldB {
    position: fixed;
    inset: 0;
  }
  #fx {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.035;
    mix-blend-mode: multiply;
  }
  #shimmer {
    position: fixed;
    inset: -10%;
    pointer-events: none;
  }
  .voice-mark {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #b8bdae;
    filter: blur(1px);
    transform: translate(-50%, -50%);
  }
  #title {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-family: 'Megrim', Optima, Georgia, serif;
    font-weight: 400;
    font-size: 15vw;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.55);
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.4), 0 2px 12px rgba(60, 65, 65, 0.12);
    user-select: none;
    transition: opacity 8s ease;
  }
  #enter {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #9a9d90;
    background: #eef0ea;
    transition: opacity 3s ease;
    cursor: pointer;
  }
  #enter.gone {
    opacity: 0;
    pointer-events: none;
  }
  #modeLabel {
    position: fixed;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(100, 105, 95, 0.4);
    cursor: pointer;
    padding: 16px;
    z-index: 5;
    user-select: none;
    -webkit-user-select: none;
  }
  #modeLabel span { transition: opacity 1.5s ease; }
  #modeLabel .sep { margin: 0 1.1em; opacity: 0.4; }
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px;
    background: rgba(255, 255, 255, 0.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  #topbar a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(70, 80, 75, 0.7);
    text-decoration: none;
    transition: color 0.4s ease;
  }
  #topbar a:hover { color: rgba(70, 80, 75, 1); }
  #topbar svg { width: 14px; height: 14px; }
</style>
</head>
<body>

<div id="field"></div>
<div id="fieldB"></div>
<canvas id="grain"></canvas>
<canvas id="fx"></canvas>
<svg id="shimmer"></svg>
<div id="title">HAZE</div>
<div id="enter">touch to begin</div>
<div id="modeLabel"><span data-m="0">day</span><span class="sep">·</span><span data-m="1">night</span></div>

<div id="topbar">
  <a id="homeLink" href="https://humanmotives.org">← Human Motives</a>
  <a id="kofiLink" href="https://ko-fi.com/chrisvanderlinden" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/>
      <path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/>
      <path d="M8 2.5v2M12 2.5v2"/>
    </svg>
    Ko-fi
  </a>
</div>

<script>
(function () {

  // ---------- modes: day and night ----------
  // Two clearly different worlds. DAY: major, lydian and open scales in a high
  // register, bright and dry, quick and busy. NIGHT: solemn minor/phrygian
  // scales one to two octaves lower, dark, muted, wet, slow. Everything that
  // plays (voices, arp, bells, whisps) follows the scale and register.
  const MODES = [
    {
      name: 'day',
      root: 261.63, // C4
      scales: [[0, 2, 4, 7, 9], [0, 2, 4, 6, 9], [0, 2, 4, 7, 11], [0, 2, 5, 7, 9]], // major pent, lydian, maj7, sus
      offsets: [-5, -3, 0, 2, 5, 7],
      voiceMax: 440, // highest pitch a main voice may use (sines get piercing on small speakers)
      hueBase: 200, hueRange: 20, satBase: 58, light: [93, 84, 72],
      glowHue: 46, glowRange: 10, glow: [97, 90],
      titleColor: [255, 255, 255], labelColor: [90, 100, 105, 0.55],
      highpassHz: 190, filterBaseHz: 8200, filterSwing: 2200, wetBase: 0.8, revLongBias: 0.4,
      voiceFilterMult: 1.15,
      whispRateMult: 1.5, whispPeakMult: 1.1,
      densityMult: 1.35, tremMult: 1.3, envMult: 0.7,
      arpStepMult: 0.78, arpGapMult: 0.8, bellMult: 1.6,
      tensionOffset: 0.12, subMax: 110, subGain: 1.0, upperMult: 1.0, outputTrim: 1.0,
    },
    {
      name: 'night',
      root: 65.41, // C2
      scales: [[0, 3, 5, 7, 10], [0, 1, 5, 7, 10], [0, 2, 3, 7, 8], [0, 3, 5, 8, 10], [0, 2, 3, 7, 10]], // minor pent, phrygian, aeolian-b6, ...
      offsets: [-2, 0, 2, 3, 5, 7],
      voiceMax: 260,
      hueBase: 228, hueRange: 14, satBase: 55, light: [20, 12, 6],
      glowHue: 218, glowRange: 12, glow: [30, 18],
      titleColor: [200, 212, 240], labelColor: [190, 200, 230, 0.6],
      highpassHz: 45, filterBaseHz: 2400, filterSwing: 900, wetBase: 1.25, revLongBias: 0.8,
      voiceFilterMult: 0.75,
      whispRateMult: 0.6, whispPeakMult: 0.7,
      densityMult: 0.8, tremMult: 0.8, envMult: 1.25,
      arpStepMult: 1.35, arpGapMult: 1.2, bellMult: 0.8,
      tensionOffset: -0.15, subMax: 62, subGain: 1.0, upperMult: 1.7, outputTrim: 0.98, // ~1 dB under day on the A-weighted meter: deep notes feel heavier than A-weighting says
    },
  ];
  // cancels the browsers' built-in make-up gain of the final leveler (+3.6 dB) and limiter (+1.7 dB)
  const TRIM_COMP = Math.pow(10, -(3.6 + 1.7) / 20);

  // start on whatever fits the time of day on the device; the toggle overrides
  const hourNow = new Date().getHours();
  let currentModeIndex = (hourNow >= 7 && hourNow < 19) ? 0 : 1;
  let nightAmt = currentModeIndex === 1 ? 1 : 0; // eases toward 0 (day) or 1 (night)

  // chord tension = the chapter's tension plus the mode's lean
  function effTension() {
    return Math.max(0, Math.min(1, chapter.tension + MODES[currentModeIndex].tensionOffset));
  }

  // append ?fast to the URL to run the slow timers ~12x faster (for testing)
  const TS = /[?&]fast\b/.test(location.search) ? 0.08 : 1;

  // ---------- harmony: the tonal centre drifts over time ----------
  let harmony = { rootOffset: 0, scaleIdx: 0 };
  let currentNotes = [];

  function computeNotes(modeIdx, rootOffset, scaleIdx) {
    const mode = MODES[modeIdx];
    const rootFreq = mode.root * Math.pow(2, rootOffset / 12);
    return mode.scales[scaleIdx].map(i => rootFreq * Math.pow(2, i / 12));
  }
  function pitchClasses(notes) {
    return new Set(notes.map(f => ((Math.round(12 * Math.log2(f / 16.3516)) % 12) + 12) % 12));
  }
  currentNotes = computeNotes(currentModeIndex, 0, 0);

  // ---------- scale ----------
  // rebuilt whenever the mode or the harmony changes; spread across octaves
  const scale = [];
  function rebuildScale() {
    scale.length = 0;
    [1, 1, 2, 2].forEach(mult => currentNotes.forEach(f => scale.push(f * mult)));
  }
  rebuildScale();

  // move to a related scale/root that keeps at least 3 of the 5 pitch
  // classes, so the change is a slow colour shift rather than a break.
  // notes already sounding finish in the old scale; new ones use the new.
  function driftHarmony() {
    const mode = MODES[currentModeIndex];
    const cur = pitchClasses(currentNotes);
    for (let i = 0; i < 40; i++) {
      const off = mode.offsets[Math.floor(Math.random() * mode.offsets.length)];
      const si = Math.floor(Math.random() * mode.scales.length);
      if (off === harmony.rootOffset && si === harmony.scaleIdx) continue;
      const notes = computeNotes(currentModeIndex, off, si);
      let shared = 0;
      pitchClasses(notes).forEach(pc => { if (cur.has(pc)) shared++; });
      if (shared >= 3) {
        harmony = { rootOffset: off, scaleIdx: si };
        currentNotes = notes;
        rebuildScale();
        return;
      }
    }
  }

  // ---------- journey: slow chapters that steer the whole mood ----------
  // tension: chord colour (open 4ths/5ths -> thirds -> sus2/add9 clusters)
  // density: how often notes start. bright/wet: filter and reverb offsets.
  // hueShift: palette drift. breath: chance of a breath-pad with a note.
  // bell: rate multiplier for the soft FM bell.
  const CHAPTERS = [
    { name: 'base',  tension: 0.45, density: 1.00, bright:  0.00, wet: 0.00, hueShift:   0, breath: 0.15, bell: 1.0 },
    { name: 'still', tension: 0.10, density: 0.65, bright: -0.15, wet: 0.10, hueShift:   0, breath: 0.10, bell: 0.6 },
    { name: 'open',  tension: 0.40, density: 1.00, bright:  0.20, wet: 0.00, hueShift:  14, breath: 0.20, bell: 1.0 },
    { name: 'bloom', tension: 0.80, density: 1.20, bright:  0.40, wet: 0.15, hueShift:  28, breath: 0.40, bell: 1.2 },
    { name: 'drift', tension: 0.30, density: 0.85, bright:  0.00, wet: 0.05, hueShift: -14, breath: 0.25, bell: 0.8 },
    { name: 'dusk',  tension: 0.55, density: 0.70, bright: -0.40, wet: 0.30, hueShift: -28, breath: 0.35, bell: 0.7 },
  ];
  let chapterIdx = 0;
  let chapter = CHAPTERS[0];
  let chapterTimer = null;
  let journeyStarted = false;

  function nextChapter() {
    let i;
    do { i = Math.floor(Math.random() * CHAPTERS.length); } while (i === chapterIdx);
    chapterIdx = i;
    chapter = CHAPTERS[i];
    driftHarmony();
    applyEnvironment(25);
    scheduleChapter();
  }
  function scheduleChapter() {
    clearTimeout(chapterTimer);
    chapterTimer = setTimeout(nextChapter, (360 + Math.random() * 360) * 1000 * TS); // 6–12 min
  }

  // ---------- audio ----------
  let ctx, masterGain, masterFilter, masterHighpass, convolverLong, convolverShort, dryGain, wetGain, freezeGain, compressor, noiseBuffer,
      revShortGain, revLongGain, revDepthShort, revDepthLong, masterFilterDepth, trimGain;
  let started = false;
  let brightnessBias = 0; // -1..1, nudged by touch, decays back to 0
  let activeVoices = 0;
  const MAX_VOICES = 2;

  function buildImpulse(duration, decay) {
    const rate = ctx.sampleRate;
    const length = rate * duration;
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  // a sine LFO that starts at a random point of its cycle. plain oscillators
  // all start at phase 0, which lined every slow swell up at the beginning and
  // made the first half minute about 10 dB louder than the rest.
  function phasedOsc(freq) {
    const o = ctx.createOscillator();
    const ph = Math.random() * Math.PI * 2;
    o.setPeriodicWave(ctx.createPeriodicWave(new Float32Array([0, Math.sin(ph)]), new Float32Array([0, Math.cos(ph)])));
    o.frequency.value = freq;
    return o;
  }

  function buildNoiseBuffer(duration) {
    const rate = ctx.sampleRate;
    const length = rate * duration;
    const buffer = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
      }
    }
    return buffer;
  }

  function initAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();

    const setup = () => {
      compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -32;
      compressor.knee.value = 30;
      compressor.ratio.value = 2.5;
      compressor.attack.value = 2;
      compressor.release.value = 3;

      masterGain = ctx.createGain();
      masterGain.gain.value = 0.6;

      masterHighpass = ctx.createBiquadFilter();
      masterHighpass.type = 'highpass';
      masterHighpass.frequency.value = MODES[currentModeIndex].highpassHz;
      masterHighpass.Q.value = 0.2;

      masterFilter = ctx.createBiquadFilter();
      masterFilter.type = 'lowpass';
      masterFilter.frequency.value = MODES[currentModeIndex].filterBaseHz;
      masterFilter.Q.value = 0.2;

      convolverLong = ctx.createConvolver();
      convolverLong.buffer = buildImpulse(15, 2.1); // the original locked tail
      convolverShort = ctx.createConvolver();
      convolverShort.buffer = buildImpulse(6, 2.8);
      noiseBuffer = buildNoiseBuffer(6);

      dryGain = ctx.createGain();
      dryGain.gain.value = 0.8;
      wetGain = ctx.createGain();
      wetGain.gain.value = MODES[currentModeIndex].wetBase;
      freezeGain = ctx.createGain();
      freezeGain.gain.value = 1;

      // the reverb send breathes on its own slow cycle — swells, recedes
      const swellLFO = phasedOsc(0.006 + Math.random() * 0.004); // ~3–4 min cycle
      const swellDepth = ctx.createGain();
      swellDepth.gain.value = 0.35;
      swellLFO.connect(swellDepth).connect(wetGain.gain);
      swellLFO.start();

      // second reverb-amount cycle on a different, slower period so the
      // combined swell never repeats the same way
      const swellLFO2 = phasedOsc(1 / (380 + Math.random() * 160));
      const swellDepth2 = ctx.createGain();
      swellDepth2.gain.value = 0.2;
      swellLFO2.connect(swellDepth2).connect(wetGain.gain);
      swellLFO2.start();

      // the whole piece breathes in overall loudness — never sitting at one
      // level for long. two non-aligned slow cycles summed so it doesn't
      // feel mechanical.
      const volSwellA = phasedOsc(1 / 150);
      const volSwellB = phasedOsc(1 / 230);
      const volDepthA = ctx.createGain(); volDepthA.gain.value = 0.13;
      const volDepthB = ctx.createGain(); volDepthB.gain.value = 0.08;
      volSwellA.connect(volDepthA).connect(masterGain.gain);
      volSwellB.connect(volDepthB).connect(masterGain.gain);
      volSwellA.start();
      volSwellB.start();

      // the whole piece also dulls and opens up again over minutes,
      // independent of any single tone's own filter
      const masterFilterLFO = phasedOsc(1 / 210);
      masterFilterDepth = ctx.createGain();
      masterFilterDepth.gain.value = MODES[currentModeIndex].filterSwing;
      masterFilterLFO.connect(masterFilterDepth).connect(masterFilter.frequency);
      masterFilterLFO.start();

      masterHighpass.connect(masterFilter);
      masterFilter.connect(dryGain).connect(masterGain);
      // reverb size drifts between a shorter and the original long tail over
      // ~5–7 minutes; biased toward the long one so the base character stays
      // each mode has its own balance between the short and the long tail
      const bias0 = MODES[currentModeIndex].revLongBias;
      const depth0 = Math.min(0.3, bias0, 1 - bias0);
      revShortGain = ctx.createGain(); revShortGain.gain.value = 1 - bias0;
      revLongGain = ctx.createGain(); revLongGain.gain.value = bias0;
      const revSizeLFO = phasedOsc(1 / (300 + Math.random() * 120));
      revDepthShort = ctx.createGain(); revDepthShort.gain.value = depth0;
      revDepthLong = ctx.createGain(); revDepthLong.gain.value = -depth0;
      revSizeLFO.connect(revDepthShort).connect(revShortGain.gain);
      revSizeLFO.connect(revDepthLong).connect(revLongGain.gain);
      revSizeLFO.start();
      masterFilter.connect(convolverLong).connect(revLongGain).connect(freezeGain);
      masterFilter.connect(convolverShort).connect(revShortGain).connect(freezeGain);
      freezeGain.connect(wetGain).connect(masterGain);
      // final stage: a slow leveler tames the louder passages (clusters, arps,
      // swells) and a limiter catches anything unexpected. browsers add
      // make-up gain to every DynamicsCompressor (measured: +3.6 dB for the
      // leveler, +1.7 dB for the limiter at these settings); the trim cancels
      // that, so these two stages only shape the dynamics. the mode trim then
      // sets the day/night loudness balance.
      const leveler = ctx.createDynamicsCompressor();
      leveler.threshold.value = -16;
      leveler.knee.value = 12;
      leveler.ratio.value = 2.5;
      leveler.attack.value = 0.35;
      leveler.release.value = 3;
      trimGain = ctx.createGain();
      trimGain.gain.value = MODES[currentModeIndex].outputTrim * TRIM_COMP;
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -3;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.004;
      limiter.release.value = 0.3;
      // a gentle fade-in at the very start
      const fadeIn = ctx.createGain();
      fadeIn.gain.setValueAtTime(0, ctx.currentTime);
      fadeIn.gain.linearRampToValueAtTime(1, ctx.currentTime + 8);
      masterGain.connect(compressor).connect(leveler).connect(trimGain).connect(limiter).connect(fadeIn).connect(ctx.destination);

      startCloudLayer();
      scheduleVoice();
      scheduleFreeze();
      scheduleWhisp();
      setupEcho();
      setupResonator();
      scheduleSub();
      scheduleAir();
      startJourney();
    };

    setup();
  }

  // ---------- echo: a dark ping-pong delay that adds width and depth ----------
  // plucks, bells and whisps send into it. the repeats alternate hard left
  // and right, each one darker and quieter than the last.
  let echoIn = null;
  function setupEcho() {
    echoIn = ctx.createGain();
    const dL = ctx.createDelay(3); dL.delayTime.value = 0.41;
    const dR = ctx.createDelay(3); dR.delayTime.value = 0.63;
    const lpA = ctx.createBiquadFilter(); lpA.type = 'lowpass'; lpA.frequency.value = 2400;
    const lpB = ctx.createBiquadFilter(); lpB.type = 'lowpass'; lpB.frequency.value = 2400;
    const fbA = ctx.createGain(); fbA.gain.value = 0.42;
    const fbB = ctx.createGain(); fbB.gain.value = 0.42;
    const pL = ctx.createStereoPanner(); pL.pan.value = -0.85;
    const pR = ctx.createStereoPanner(); pR.pan.value = 0.85;
    const out = ctx.createGain(); out.gain.value = 0.75;
    echoIn.connect(dL);
    dL.connect(lpA).connect(fbA).connect(dR);
    dR.connect(lpB).connect(fbB).connect(dL);
    dL.connect(pL).connect(out);
    dR.connect(pR).connect(out);
    out.connect(masterHighpass);
  }
  function echoSend(node, amount) {
    if (!echoIn) return;
    const g = ctx.createGain();
    g.gain.value = amount;
    node.connect(g).connect(echoIn);
  }

  // ---------- resonator: a quiet modal bank ----------
  // four narrow, slightly inharmonic bandpass filters fed from the whole
  // mix. its send level swells in and out on a slow cycle, and the bank
  // retunes to a new scale note every minute or so.
  let resFilters = [];
  function setupResonator() {
    const resSend = ctx.createGain();
    resSend.gain.value = 0;
    const resLevelLFO = ctx.createOscillator();
    resLevelLFO.frequency.value = 1 / (180 + Math.random() * 90);
    const resLevelDepth = ctx.createGain(); resLevelDepth.gain.value = 0.3;
    const resLevelFloor = ctx.createConstantSource(); resLevelFloor.offset.value = 0.3;
    resLevelLFO.connect(resLevelDepth).connect(resSend.gain);
    resLevelFloor.connect(resSend.gain);

    const resOut = ctx.createGain();
    resOut.gain.value = 2.2;
    const resLP = ctx.createBiquadFilter();
    resLP.type = 'lowpass';
    resLP.frequency.value = 4200;

    const ratios = [1, 2.01, 2.99, 4.03];
    const pans = [-0.7, -0.25, 0.25, 0.7];
    resFilters = ratios.map((r, i) => {
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass';
      f.Q.value = 90;
      const p = ctx.createStereoPanner();
      p.pan.value = pans[i];
      resSend.connect(f);
      f.connect(p).connect(resOut);
      return { f, r };
    });

    masterFilter.connect(resSend);
    resOut.connect(resLP).connect(masterGain);
    resLevelLFO.start();
    resLevelFloor.start();
    retuneResonator(true);
  }

  function retuneResonator(immediate) {
    let base = pickFreq();
    while (base * 4.03 > 3800) base /= 2;
    const t = ctx.currentTime;
    resFilters.forEach(({ f, r }) => {
      if (immediate === true) f.frequency.setValueAtTime(base * r, t);
      else f.frequency.setTargetAtTime(base * r, t, 6);
    });
    setTimeout(retuneResonator, (50 + Math.random() * 70) * 1000);
  }

  // ---------- sub bass: extremely long, extremely soft ----------
  // an octave under a scale note, bypassing the master highpass and the
  // reverb so it stays clean. one every 1.5–3.5 minutes, 2 at most.
  let activeSubs = 0;
  function scheduleSub() {
    playSub();
    setTimeout(scheduleSub, (90 + Math.random() * 120) * 1000);
  }

  function playSub() {
    if (activeSubs >= 2) return;
    activeSubs++;
    const t = ctx.currentTime;
    const modeS = MODES[currentModeIndex];
    let freq = currentNotes[Math.floor(Math.random() * currentNotes.length)];
    while (freq > modeS.subMax) freq /= 2;
    while (freq < 36) freq *= 2;

    const oscA = ctx.createOscillator();
    oscA.type = 'sine';
    oscA.frequency.value = freq;
    const oscB = ctx.createOscillator();
    oscB.type = 'sine';
    oscB.frequency.value = freq;
    oscB.detune.value = 4 + Math.random() * 3; // slow beating against oscA

    const trembleLFO = ctx.createOscillator();
    trembleLFO.frequency.value = 0.03 + Math.random() * 0.04;
    const trembleDepth = ctx.createGain();
    trembleDepth.gain.value = 2;
    trembleLFO.connect(trembleDepth);
    trembleDepth.connect(oscA.detune);
    trembleDepth.connect(oscB.detune);

    const tremGain = ctx.createGain();
    tremGain.gain.value = 1;
    const tremLFO = ctx.createOscillator();
    tremLFO.frequency.value = 1 / (18 + Math.random() * 20);
    const tremDepth = ctx.createGain();
    tremDepth.gain.value = 0.25;
    tremLFO.connect(tremDepth).connect(tremGain.gain);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 220;
    lp.Q.value = 0.3;

    const env = ctx.createGain();
    env.gain.value = 0;

    oscA.connect(tremGain);
    oscB.connect(tremGain);
    tremGain.connect(lp).connect(env).connect(masterGain);

    const attack = 45 + Math.random() * 30;
    const hold = 60 + Math.random() * 50;
    const release = 55 + Math.random() * 35;
    const peak = (0.03 + Math.random() * 0.02) * modeS.subGain;

    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(peak, t + attack);
    env.gain.setValueAtTime(peak, t + attack + hold);
    env.gain.linearRampToValueAtTime(0, t + attack + hold + release);

    const nodes = [oscA, oscB, trembleLFO, tremLFO];
    nodes.forEach(n => n.start(t));
    const stopTime = t + attack + hold + release + 1;
    nodes.forEach(n => n.stop(stopTime));
    oscA.onended = () => { activeSubs--; };
  }

  // ---------- air: an occasional fresh high layer over the texture ----------
  function scheduleAir() {
    setTimeout(() => {
      playAir();
      scheduleAir();
    }, (40 + Math.random() * 70) * 1000);
  }

  function playAir() {
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.8;
    const f1 = 6000 + Math.random() * 2500;
    const f2 = 6000 + Math.random() * 3000;

    const gain = ctx.createGain();
    gain.gain.value = 0;

    const panner = ctx.createStereoPanner();
    const p0 = (Math.random() * 2 - 1) * 0.8;
    const p1 = (Math.random() * 2 - 1) * 0.8;

    src.connect(filter).connect(gain).connect(panner).connect(masterHighpass);

    const rise = 8 + Math.random() * 10;
    const hold = 6 + Math.random() * 18;
    const fall = 12 + Math.random() * 14;
    const total = rise + hold + fall;
    const peak = 0.008 + Math.random() * 0.008;

    filter.frequency.setValueAtTime(f1, t);
    filter.frequency.linearRampToValueAtTime(f2, t + total);
    panner.pan.setValueAtTime(p0, t);
    panner.pan.linearRampToValueAtTime(p1, t + total);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + rise);
    gain.gain.setValueAtTime(peak, t + rise + hold);
    gain.gain.linearRampToValueAtTime(0, t + total);

    src.start(t);
    src.stop(t + total + 0.5);
  }

  // high, fast-vibrato flutters that dart in and out quickly — trailing
  // wisps of cloud, not sustained tones. entirely independent of the main
  // voices, cloud bed, and freeze system — added on top, changes nothing
  // else about the locked base.
  function scheduleWhisp() {
    if (!inHush() && !arpActive) playWhisp();
    const nextIn = ((7 + Math.random() * 18) * 1000) / MODES[currentModeIndex].whispRateMult;
    setTimeout(scheduleWhisp, nextIn);
  }

  function playWhisp() {
    const roll = Math.random();
    if (roll < 0.5) playWhispFlutter();
    else if (roll < 0.78) playWhispWail();
    else playWhispNoise();
  }

  // the original fast-vibrato flutter — now an octave lower and a touch
  // quieter, still sitting above the mid layers (ratio ~3) of the main voices
  function playWhispFlutter() {
    const t = ctx.currentTime;
    const rootFreq = pickFreq();
    const ratios = [3, 4, 5, 6, 8];
    let freq = rootFreq * ratios[Math.floor(Math.random() * ratios.length)];
    while (freq > 5000) freq /= 2; // no piercing highs, even in day mode

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const vibratoLFO = ctx.createOscillator();
    vibratoLFO.frequency.value = 5.5 + Math.random() * 5;
    const vibratoDepth = ctx.createGain();
    vibratoDepth.gain.value = 18 + Math.random() * 28;
    vibratoLFO.connect(vibratoDepth).connect(osc.detune);

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = 2.2;

    const gain = ctx.createGain();
    gain.gain.value = 0;

    const panner = ctx.createStereoPanner();
    panner.pan.value = (Math.random() * 2 - 1) * 0.9;

    osc.connect(filter).connect(gain).connect(panner).connect(masterHighpass);
    echoSend(panner, 0.3);
    osc.start(t);
    vibratoLFO.start(t);

    const attack = 1.2 + Math.random() * 2.2;
    const hold = 0.4 + Math.random() * 1.6;
    const release = 1.8 + Math.random() * 2.6;
    const peak = (0.007 + Math.random() * 0.007) * MODES[currentModeIndex].whispPeakMult;

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + attack);
    gain.gain.setValueAtTime(peak, t + attack + hold);
    gain.gain.linearRampToValueAtTime(0, t + attack + hold + release);

    const stopTime = t + attack + hold + release + 0.5;
    osc.stop(stopTime);
    vibratoLFO.stop(stopTime);
  }

  // a slow pitch-bend — like a far-off dolphin or whale call, gliding
  // gently between two nearby pitches over several seconds
  function playWhispWail() {
    const t = ctx.currentTime;
    const rootFreq = pickFreq();
    const ratios = [3, 4, 5, 6];
    let startFreq = rootFreq * ratios[Math.floor(Math.random() * ratios.length)];
    while (startFreq > 4200) startFreq /= 2;
    const bendCents = (Math.random() < 0.5 ? 1 : -1) * (250 + Math.random() * 350);
    const endFreq = startFreq * Math.pow(2, bendCents / 1200);

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = startFreq;

    const wobbleLFO = ctx.createOscillator();
    wobbleLFO.frequency.value = 2 + Math.random() * 2; // slower, broader than the flutter's vibrato
    const wobbleDepth = ctx.createGain();
    wobbleDepth.gain.value = 15 + Math.random() * 25;
    wobbleLFO.connect(wobbleDepth).connect(osc.detune);

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = startFreq;
    filter.Q.value = 1.6;

    const gain = ctx.createGain();
    gain.gain.value = 0;

    const panner = ctx.createStereoPanner();
    panner.pan.value = (Math.random() * 2 - 1) * 0.9;

    osc.connect(filter).connect(gain).connect(panner).connect(masterHighpass);
    echoSend(panner, 0.3);
    osc.start(t);
    wobbleLFO.start(t);

    const bendTime = 4 + Math.random() * 6;
    const attack = 1.8 + Math.random() * 2;
    const hold = 0.3 + Math.random() * 1;
    const release = 2.5 + Math.random() * 3;
    const peak = (0.006 + Math.random() * 0.006) * MODES[currentModeIndex].whispPeakMult; // distant, sparse

    osc.frequency.setValueAtTime(startFreq, t);
    osc.frequency.linearRampToValueAtTime(endFreq, t + bendTime);
    filter.frequency.setValueAtTime(startFreq, t);
    filter.frequency.linearRampToValueAtTime(endFreq, t + bendTime);

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + attack);
    gain.gain.setValueAtTime(peak, t + attack + hold);
    gain.gain.linearRampToValueAtTime(0, t + attack + hold + release);

    const stopTime = Math.max(t + bendTime, t + attack + hold + release) + 0.5;
    osc.stop(stopTime);
    wobbleLFO.stop(stopTime);
  }

  // a whisp made of filtered noise rather than a tone — an airy, breathy
  // texture instead of a pitched flutter
  function playWhispNoise() {
    const t = ctx.currentTime;
    const rootFreq = pickFreq();
    const ratios = [3, 4, 5, 6, 8];
    let freq = rootFreq * ratios[Math.floor(Math.random() * ratios.length)];
    while (freq > 5000) freq /= 2; // no piercing highs, even in day mode

    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    noiseSrc.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = 3.5;

    const flutterLFO = ctx.createOscillator();
    flutterLFO.frequency.value = 3 + Math.random() * 4;
    const flutterDepth = ctx.createGain();
    flutterDepth.gain.value = freq * 0.25;
    flutterLFO.connect(flutterDepth).connect(filter.frequency);

    const gain = ctx.createGain();
    gain.gain.value = 0;

    const panner = ctx.createStereoPanner();
    panner.pan.value = (Math.random() * 2 - 1) * 0.9;

    noiseSrc.connect(filter).connect(gain).connect(panner).connect(masterHighpass);
    echoSend(panner, 0.3);
    noiseSrc.start(t);
    flutterLFO.start(t);

    const attack = 1.5 + Math.random() * 2.5;
    const hold = 0.5 + Math.random() * 1.8;
    const release = 2 + Math.random() * 2.6;
    const peak = (0.006 + Math.random() * 0.006) * MODES[currentModeIndex].whispPeakMult;

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + attack);
    gain.gain.setValueAtTime(peak, t + attack + hold);
    gain.gain.linearRampToValueAtTime(0, t + attack + hold + release);

    const stopTime = t + attack + hold + release + 0.5;
    noiseSrc.stop(stopTime);
    flutterLFO.stop(stopTime);
  }

  // an occasional long "freeze" — the reverb tail blooms and holds well
  // above its usual level, then fades back, on its own irregular clock.
  // rarer and larger than the constant swellLFO breathing.
  function scheduleFreeze() {
    const t = ctx.currentTime;
    const peak = 1.6 + Math.random() * 1.0;
    const rise = 18 + Math.random() * 22;
    const hold = 22 + Math.random() * 35;
    const fall = 28 + Math.random() * 35;
    freezeGain.gain.cancelScheduledValues(t);
    freezeGain.gain.setValueAtTime(1, t);
    freezeGain.gain.linearRampToValueAtTime(peak, t + rise);
    freezeGain.gain.setValueAtTime(peak, t + rise + hold);
    freezeGain.gain.linearRampToValueAtTime(1, t + rise + hold + fall);
    const totalMs = (rise + hold + fall) * 1000;
    const gapMs = (40 + Math.random() * 110) * 1000;
    setTimeout(scheduleFreeze, totalMs + gapMs);
  }

  function pickFreq() {
    return scale[Math.floor(Math.random() * scale.length)];
  }

  // pitch for a main voice: never above the mode's ceiling, and now and
  // then an octave lower (as long as it stays clear of the master highpass)
  function pickVoiceFreq() {
    const mode = MODES[currentModeIndex];
    let f = pickFreq();
    while (f > mode.voiceMax) f /= 2;
    if (Math.random() < 0.2 && f / 2 >= mode.highpassHz * 0.95) f /= 2;
    return f;
  }

  function startCloudLayer() {
    const cloud = ctx.createBufferSource();
    cloud.buffer = noiseBuffer;
    cloud.loop = true;

    const cloudFilter = ctx.createBiquadFilter();
    cloudFilter.type = 'lowpass';
    cloudFilter.frequency.value = 700;
    cloudFilter.Q.value = 0.3;
    const cloudFilterLFO = ctx.createOscillator();
    cloudFilterLFO.frequency.value = 1 / 95;
    const cloudFilterLFOGain = ctx.createGain();
    cloudFilterLFOGain.gain.value = 350;
    cloudFilterLFO.connect(cloudFilterLFOGain).connect(cloudFilter.frequency);

    const cloudGain = ctx.createGain();
    cloudGain.gain.value = 0;

    // three slow, non-aligned swell cycles summed together — the combination
    // never quite lines up the same way twice, like clouds or distant surf
    const swellA = phasedOsc(1 / 71);
    const swellB = phasedOsc(1 / 113);
    const swellC = phasedOsc(1 / 47);
    const depthA = ctx.createGain(); depthA.gain.value = 0.045;
    const depthB = ctx.createGain(); depthB.gain.value = 0.035;
    const depthC = ctx.createGain(); depthC.gain.value = 0.025;
    const floor = ctx.createConstantSource(); floor.offset.value = 0.06;
    swellA.connect(depthA).connect(cloudGain.gain);
    swellB.connect(depthB).connect(cloudGain.gain);
    swellC.connect(depthC).connect(cloudGain.gain);
    floor.connect(cloudGain.gain);

    const cloudPanner = ctx.createStereoPanner();
    const cloudPanLFO = ctx.createOscillator();
    cloudPanLFO.frequency.value = 1 / 160;
    const cloudPanGain = ctx.createGain();
    cloudPanGain.gain.value = 0.5;
    cloudPanLFO.connect(cloudPanGain).connect(cloudPanner.pan);

    cloud.connect(cloudFilter).connect(cloudGain).connect(cloudPanner).connect(masterHighpass);

    [cloud, cloudFilterLFO, swellA, swellB, swellC, floor, cloudPanLFO].forEach(n => n.start());
  }

  function playVoice(opts) {
    opts = opts || {};
    const cap = opts.cap || (opts.companion ? 3 : MAX_VOICES); // chord tones may bring it to 3
    if (activeVoices >= cap) return null;
    activeVoices++;

    const t = ctx.currentTime;
    const freq = opts.freq || pickVoiceFreq();

    // shared per-voice bus: filter -> envelope -> panner -> out
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 0.22;
    // lower notes get proportionally darker filtering — the lower the
    // pitch, the more it needs cutting back to avoid feeling full-bodied
    const baseCut = (650 + freq * 2.0) * (0.85 + Math.random() * 0.3) * MODES[currentModeIndex].voiceFilterMult;
    filter.frequency.value = baseCut;

    const filterLFO = ctx.createOscillator();
    filterLFO.frequency.value = 1 / (110 + Math.random() * 90); // 110–200s cycles
    const filterLFOGain = ctx.createGain();
    filterLFOGain.gain.value = 550 + Math.random() * 250;
    filterLFO.connect(filterLFOGain).connect(filter.frequency);

    const gain = ctx.createGain();
    gain.gain.value = 0;

    const panner = ctx.createStereoPanner();
    const panCenter = (Math.random() * 2 - 1) * 0.6;
    panner.pan.value = panCenter;
    const panLFO = ctx.createOscillator();
    panLFO.frequency.value = 0.008 + Math.random() * 0.015;
    const panLFOGain = ctx.createGain();
    panLFOGain.gain.value = 0.3;
    panLFO.connect(panLFOGain).connect(panner.pan);

    filter.connect(gain).connect(panner).connect(masterHighpass);

    // the tremble — a barely-there slow pitch wobble, shared across all layers
    // so they breathe together rather than independently
    const trembleLFO = ctx.createOscillator();
    trembleLFO.frequency.value = 0.04 + Math.random() * 0.08;
    const trembleGain = ctx.createGain();
    trembleGain.gain.value = 1.5 + Math.random() * 2; // cents

    const allNodes = [filterLFO, panLFO, trembleLFO];

    // layers pitched apart at subtle volumes — each with its own fast tremolo
    // rate, close but never identical, so their sums beat and drift against
    // each other on their own. this interference is the whole point.
    // each layer has its own place in the stereo image: the detuned unisons
    // sit left and right of each other (real stereo beating on headphones),
    // the upper partials fan out around them
    const layerDefs = [
      { ratio: 1,   level: 1.0,   detune: 0,                       tremRate: 3.6 + Math.random() * 1.2, pan:  0.00 },
      { ratio: 1,   level: 0.20,  detune:  3 + Math.random() * 5,   tremRate: 5.1 + Math.random() * 1.8, pan: -0.55 },
      { ratio: 1,   level: 0.16,  detune: -(4 + Math.random() * 6), tremRate: 6.4 + Math.random() * 2.0, pan:  0.55 },
      { ratio: 2,   level: 0.11,  detune: 0,                       tremRate: 7.6 + Math.random() * 2.4, pan:  0.30 },
      { ratio: 1.5, level: 0.08,  detune: 0,                       tremRate: 2.7 + Math.random() * 1.1, pan: -0.30 },
      { ratio: 3,   level: 0.035, detune: 0,                       tremRate: 9.0 + Math.random() * 2.6, pan:  0.45 },
      { ratio: 4,   level: 0.025, detune: 0,                       tremRate: 13 + Math.random() * 9,    pan: -0.45 },
      { ratio: 6,   level: 0.015, detune: 0,                       tremRate: 17 + Math.random() * 10,   pan:  0.60 },
    ];

    const modeP = MODES[currentModeIndex];
    layerDefs.forEach(d => { d.tremRate *= modeP.tremMult; });
    layerDefs.forEach(def => {
      const layerGain = ctx.createGain();
      // upper layers (fifth, octave, higher partials) count more at night: they carry the
      // audible body of a very low note without adding peak energy at 60 Hz
      layerGain.gain.value = def.level * (def.ratio >= 1.5 ? modeP.upperMult : 1);

      const tremoloGain = ctx.createGain();
      tremoloGain.gain.value = 1;
      const tremoloLFO = ctx.createOscillator();
      tremoloLFO.frequency.value = def.tremRate;
      const tremoloDepth = ctx.createGain();
      tremoloDepth.gain.value = 0.03 + Math.random() * 0.025;
      tremoloLFO.connect(tremoloDepth).connect(tremoloGain.gain);

      // the tremolo speed itself drifts slowly faster and slower over the
      // note's life — never a fixed metronomic rate
      const tremRateWobble = ctx.createOscillator();
      tremRateWobble.frequency.value = 1 / (45 + Math.random() * 50);
      const tremRateWobbleDepth = ctx.createGain();
      tremRateWobbleDepth.gain.value = 0.5 + Math.random() * 0.6;
      tremRateWobble.connect(tremRateWobbleDepth).connect(tremoloLFO.frequency);
      allNodes.push(tremRateWobble);

      const oscSine = ctx.createOscillator();
      oscSine.type = 'sine';
      oscSine.frequency.value = freq * def.ratio;
      oscSine.detune.value = def.detune;
      trembleGain.connect(oscSine.detune);

      // every layer drifts slowly around its own spot in the image
      const layerPan = ctx.createStereoPanner();
      layerPan.pan.value = def.pan;
      const layerPanLFO = ctx.createOscillator();
      layerPanLFO.frequency.value = 1 / (40 + Math.random() * 80);
      const layerPanDepth = ctx.createGain();
      layerPanDepth.gain.value = 0.12 + Math.random() * 0.15;
      layerPanLFO.connect(layerPanDepth).connect(layerPan.pan);

      oscSine.connect(tremoloGain).connect(layerGain).connect(layerPan).connect(filter);
      allNodes.push(oscSine, tremoloLFO, layerPanLFO);
    });

    allNodes.forEach(n => n.start(t));

    const attack = (20 + Math.random() * 18) * modeP.envMult;   // long, unhurried arrivals
    const hold = (26 + Math.random() * 30) * modeP.envMult;
    const release = (22 + Math.random() * 20) * modeP.envMult;
    // highs sound louder than lows at the same level: ease the highs down, lift the deep notes
    const loudnessComp = freq > 300 ? Math.pow(300 / freq, 0.5) : (freq < 160 ? Math.min(1.5, Math.pow(160 / freq, 0.6)) : 1);
    const peak = (0.045 + Math.random() * 0.035) * (1 + brightnessBias * 0.3) * (opts.level || 1) * loudnessComp;
    const noisePeak = peak * (0.12 + Math.random() * 0.1);

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(Math.max(peak, 0.004), t + attack);
    gain.gain.setValueAtTime(Math.max(peak, 0.004), t + attack + hold);
    gain.gain.linearRampToValueAtTime(0, t + attack + hold + release);

    // the note drifts slowly across the stereo field over its whole life,
    // with the LFO wobble riding on top of that movement
    const panEnd = Math.max(-0.75, Math.min(0.75, panCenter + (Math.random() * 2 - 1) * 1.0));
    panner.pan.setValueAtTime(panCenter, t);
    panner.pan.linearRampToValueAtTime(panEnd, t + attack + hold + release);

    // a whisper of filtered noise riding underneath the root pitch, with a
    // fast ripple in both amplitude and filter position — like light on
    // moving water
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    noiseSrc.loop = true;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = freq * 2;
    noiseFilter.Q.value = 1.2;

    const noiseFlutterLFO = ctx.createOscillator();
    noiseFlutterLFO.frequency.value = 9 + Math.random() * 7;
    const noiseFlutterDepth = ctx.createGain();
    noiseFlutterDepth.gain.value = freq * 0.35;
    noiseFlutterLFO.connect(noiseFlutterDepth).connect(noiseFilter.frequency);
    noiseFlutterLFO.start(t);
    allNodes.push(noiseFlutterLFO);

    const noiseRippleGain = ctx.createGain();
    noiseRippleGain.gain.value = 1;
    const noiseRippleLFO = ctx.createOscillator();
    noiseRippleLFO.frequency.value = 10 + Math.random() * 8;
    const noiseRippleDepth = ctx.createGain();
    noiseRippleDepth.gain.value = 0.35;
    noiseRippleLFO.connect(noiseRippleDepth).connect(noiseRippleGain.gain);
    noiseRippleLFO.start(t);
    allNodes.push(noiseRippleLFO);

    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0;
    noiseSrc.connect(noiseFilter).connect(noiseRippleGain).connect(noiseGain).connect(panner);
    noiseSrc.start(t);

    noiseGain.gain.setValueAtTime(0, t);
    noiseGain.gain.linearRampToValueAtTime(noisePeak, t + attack * 1.3);
    noiseGain.gain.setValueAtTime(noisePeak, t + attack + hold);
    noiseGain.gain.linearRampToValueAtTime(0, t + attack + hold + release);

    // brightness bias very gently nudges the filter open/closed
    filter.frequency.setTargetAtTime(baseCut + brightnessBias * 500, t, 6);

    const stopTime = t + attack + hold + release + 1;
    allNodes.forEach(n => n.stop(stopTime));
    noiseSrc.stop(stopTime);

    spawnVisualVoice(attack, hold, release, panCenter);

    allNodes[0].onended = () => { activeVoices--; };
    return freq;
  }

  // ---------- chord colour: follows the chapter's tension ----------
  // low  : open fourths, fifths and octaves
  // mid  : thirds and sixths as well (never a tritone)
  // high : seconds allowed too — sus2 / add9 colours and soft clusters
  function intervalOkFor(band) {
    return (a, b) => {
      const r = Math.max(a, b) / Math.min(a, b);
      const folded = r > 2.05 ? r / 2 : r;
      if (folded > 1.38 && folded < 1.46) return false; // tritone
      if (band === 0) return (folded > 1.30 && folded < 1.52) || folded >= 1.97;
      if (band === 1) return folded > 1.18;
      return folded > 1.10;
    };
  }
  function tensionBand(t) { return t < 0.33 ? 0 : (t < 0.66 ? 1 : 2); }

  function pickCompanion(rootFreq, avoid, band) {
    if (band === undefined) band = tensionBand(effTension());
    const pool = (b) => {
      const ok = intervalOkFor(b);
      return scale.filter(f => {
        const r = f / rootFreq;
        if (r < 1.10 || r > 2.1) return false;
        if (f > MODES[currentModeIndex].voiceMax * 1.25) return false;
        if (!ok(f, rootFreq)) return false;
        return !(avoid && !ok(f, avoid));
      });
    };
    let cands = pool(band);
    if (!cands.length) cands = pool(1); // fall back to the plain rule
    return cands.length ? cands[Math.floor(Math.random() * cands.length)] : null;
  }

  // ---------- hush: voices and whisps pause, only wind and air remain ----------
  let hushUntil = 0;
  function inHush() { return Date.now() < hushUntil; }
  function startHush() {
    hushUntil = Date.now() + (110 + Math.random() * 80) * 1000;
    playAir();
    setTimeout(playAir, 18000);
  }

  function scheduleVoice() {
    let rootFreq = null;
    if (!inHush()) rootFreq = playVoice();

    // some notes are joined by a quieter second tone a few seconds later,
    // rarely a third — how often and how open/tense depends on the chapter
    const t = effTension();
    if (rootFreq && Math.random() < 0.15 + t * 0.45) {
      const c1 = pickCompanion(rootFreq);
      if (c1) {
        setTimeout(() => playVoice({ freq: c1, level: 0.55, companion: true }),
          (4 + Math.random() * 10) * 1000);
        if (Math.random() < 0.15 + t * 0.5) {
          const c2 = pickCompanion(rootFreq, c1);
          if (c2 && c2 !== c1) {
            setTimeout(() => playVoice({ freq: c2, level: 0.45, companion: true }),
              (14 + Math.random() * 14) * 1000);
          }
        }
      }
    }
    // an airy breath-pad sometimes rides along with a new note
    if (rootFreq && Math.random() < chapter.breath) {
      setTimeout(() => playBreath(rootFreq * (Math.random() < 0.5 ? 1 : 2)),
        (2 + Math.random() * 6) * 1000);
    }

    const nextIn = ((14 + Math.random() * 30) * 1000) / (chapter.density * MODES[currentModeIndex].densityMult);
    setTimeout(scheduleVoice, nextIn);
  }

  // ---------- breath pad: noise shaped into a soft vowel-like chord ----------
  // three narrow bandpass filters on the note, its octave and its twelfth
  function playBreath(freq) {
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;

    const env = ctx.createGain();
    env.gain.value = 0;
    const panner = ctx.createStereoPanner();
    const p0 = (Math.random() * 2 - 1) * 0.7;
    const p1 = (Math.random() * 2 - 1) * 0.7;

    [[1, 1.0], [2, 0.6], [3, 0.35]].forEach(([mult, lvl]) => {
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = freq * mult;
      f.Q.value = 28;
      const g = ctx.createGain();
      g.gain.value = lvl * 2.4 * Math.sqrt(Math.max(1, 150 / (freq * mult))); // narrow band takes most of the noise level away; deeper notes more so
      src.connect(f).connect(g).connect(env);
    });
    env.connect(panner).connect(masterHighpass);

    const attack = 18 + Math.random() * 12;
    const hold = 20 + Math.random() * 20;
    const release = 25 + Math.random() * 15;
    const total = attack + hold + release;
    const peak = 0.55 + Math.random() * 0.25;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(peak, t + attack);
    env.gain.setValueAtTime(peak, t + attack + hold);
    env.gain.linearRampToValueAtTime(0, t + total);
    panner.pan.setValueAtTime(p0, t);
    panner.pan.linearRampToValueAtTime(p1, t + total);

    src.start(t);
    src.stop(t + total + 0.5);
  }

  // ---------- soft FM bell: a rare, quiet, inharmonic chime ----------
  function scheduleBell() {
    const base = 240 + Math.random() * 300; // seconds
    setTimeout(() => {
      if (!inHush() && !arpActive) playBell();
      scheduleBell();
    }, (base / (chapter.bell * MODES[currentModeIndex].bellMult)) * 1000 * TS);
  }

  function playBell() {
    const t = ctx.currentTime;
    let f = pickFreq() * 2;
    while (f > 1800) f /= 2;

    const carrier = ctx.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.value = f;
    const mod = ctx.createOscillator();
    mod.type = 'sine';
    mod.frequency.value = f * 2.76;
    const modGain = ctx.createGain();
    modGain.gain.setValueAtTime(f * 1.4, t);
    modGain.gain.setTargetAtTime(f * 0.03, t + 0.02, 0.7); // the brightness fades first
    mod.connect(modGain).connect(carrier.frequency);

    const amp = ctx.createGain();
    const peak = 0.012 + Math.random() * 0.010;
    amp.gain.setValueAtTime(0, t);
    amp.gain.linearRampToValueAtTime(peak, t + 0.015);
    amp.gain.setTargetAtTime(0, t + 0.03, 2.4);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3200;
    const panner = ctx.createStereoPanner();
    panner.pan.value = (Math.random() * 2 - 1) * 0.8;

    carrier.connect(amp).connect(lp).connect(panner).connect(masterHighpass);
    echoSend(panner, 0.45);
    if (window._hazePulse) window._hazePulse();
    carrier.start(t);
    mod.start(t);
    carrier.stop(t + 16);
    mod.stop(t + 16);
  }

  // ---------- rare moments: every 8–16 minutes bursts, a hush or a cluster ----------
  let lastMoment = -1;
  function scheduleMoment(first) {
    const delay = first ? (240 + Math.random() * 180) : (480 + Math.random() * 480);
    setTimeout(() => {
      if (!arpActive) playMoment();
      scheduleMoment(false);
    }, delay * 1000 * TS);
  }
  function playMoment() {
    let k;
    do {
      const r = Math.random();
      k = r < 0.40 ? 0 : (r < 0.65 ? 1 : 2);
    } while (k === lastMoment);
    lastMoment = k;
    if (k === 0) playBursts();
    else if (k === 1) startHush();
    else playCluster();
  }

  // a soft pluck: sine plus a quiet octave, fast decay
  function playPluck(freq, when, peak, pan) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    const g2 = ctx.createGain();
    g2.gain.value = 0.22;

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0, when);
    amp.gain.linearRampToValueAtTime(peak, when + 0.006);
    amp.gain.setTargetAtTime(0, when + 0.012, 0.28 + Math.random() * 0.25);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 2600;
    const panner = ctx.createStereoPanner();
    panner.pan.value = Math.max(-0.9, Math.min(0.9, pan));

    osc.connect(amp);
    osc2.connect(g2).connect(amp);
    amp.connect(lp).connect(panner).connect(masterHighpass);
    echoSend(panner, 0.55);
    setTimeout(() => { if (window._hazePulse) window._hazePulse(); }, Math.max(0, (when - ctx.currentTime) * 1000));
    osc.start(when);
    osc2.start(when);
    osc.stop(when + 4);
    osc2.stop(when + 4);
  }

  // ---------- arp episode: a few minutes in the foreground ----------
  // a looping plucked phrase that holds the attention for 2-4 minutes, then
  // thins out, slows down and fades, and the attention goes back to the
  // drone and the wind. notes are scheduled in small batches ahead of time.
  let arpActive = false;

  function buildLadder() {
    const sorted = currentNotes.slice().sort((a, b) => a - b);
    return sorted.map(f => f * 2).concat(sorted.map(f => f * 4)).map(f => {
      while (f > 1400) f /= 2; // keep plucks out of the piercing range
      return f;
    }).sort((a, b) => a - b);
  }

  function playArp(onDone, durationSec) {
    if (arpActive) return;
    arpActive = true;
    const D = durationSec || (120 + Math.random() * 120) * TS;
    const t0 = ctx.currentTime + 0.1;
    const endT = t0 + D;
    let when = t0;
    let ladder = buildLadder();
    let start = Math.floor(Math.random() * 4);
    let phrase = [];
    let L = 5;
    let noteNo = 0;
    let nextMutate = 0;
    const arpMult = MODES[currentModeIndex].arpStepMult;
    let step = (0.30 + Math.random() * 0.15) * arpMult;
    let stepTarget = step;
    const basePeak = 0.013 + Math.random() * 0.008;
    const ph1 = Math.random() * 6.28;
    const ph2 = Math.random() * 6.28;
    const panPhase = Math.random() * 6.28;

    // the phrase changes every 18-40 notes: new shape, shifted along the
    // scale, rebuilt from whatever the harmony is by then
    function newPhrase() {
      ladder = buildLadder();
      const max = ladder.length - 1;
      L = 4 + Math.floor(Math.random() * 3);
      const kind = ['up', 'updown', 'skip'][Math.floor(Math.random() * 3)];
      start = Math.max(0, Math.min(max - 3, start + Math.floor(Math.random() * 5) - 2));
      let idx = start;
      phrase = [];
      for (let k = 0; k < L; k++) {
        phrase.push(Math.max(0, Math.min(max, idx)));
        idx += kind === 'up' ? 1 : (kind === 'skip' ? 2 : (k < L / 2 ? 1 : -1));
      }
      nextMutate = noteNo + 18 + Math.floor(Math.random() * 22);
    }
    newPhrase();

    function pump() {
      const horizon = ctx.currentTime + 10;
      while (when < horizon && when < endT) {
        const prog = (when - t0) / D;
        if (noteNo >= nextMutate) newPhrase();
        if (noteNo % 16 === 0) stepTarget = (0.26 + Math.random() * 0.30) * arpMult;
        step += (stepTarget - step) * 0.08;

        // swells in over the first 15%, holds, then fades over the last 35%
        const rise = Math.min(1, prog / 0.15);
        const fall = Math.min(1, (1 - prog) / 0.35);
        const env = Math.pow(Math.sin(Math.min(rise, fall) * Math.PI / 2), 1.2);
        // two slow flutters of different length keep the volume moving
        const flutter = 0.62 + 0.25 * Math.sin(when * 2 * Math.PI / 9 + ph1)
                             + 0.13 * Math.sin(when * 2 * Math.PI / 37 + ph2);
        // rests become more common toward the end, so it thins out
        const restProb = 0.06 + 0.5 * Math.pow(Math.max(0, prog - 0.7) / 0.3, 1.5);

        let ix = phrase[noteNo % L];
        if (noteNo >= L && Math.random() < 0.15) {
          ix = Math.max(0, Math.min(ladder.length - 1, ix + (Math.random() < 0.5 ? -1 : 1)));
        }
        if (Math.random() >= restProb) {
          const peak = Math.max(0.0012, basePeak * env * flutter);
          const pan = Math.sin(when * 0.35 + panPhase) * 0.6 + (Math.random() - 0.5) * 0.15;
          playPluck(ladder[ix], when, peak, pan);
        }
        // the pulse breathes and slows down during the last fifth
        const slow = 1 + 0.6 * Math.max(0, (prog - 0.8) / 0.2);
        when += step * slow * (1 + 0.1 * Math.sin(noteNo * 0.3));
        noteNo++;
      }
      if (when < endT) {
        setTimeout(pump, 3000);
      } else {
        // once the last note has rung out, a breath of air carries the
        // attention back to the background
        setTimeout(() => {
          arpActive = false;
          playAir();
          if (onDone) onDone();
        }, Math.max(0, when - ctx.currentTime) * 1000 + 3000);
      }
    }
    pump();
  }

  // an episode every 3-7 minutes after the last one ended; the first starts
  // 100-180 seconds in
  function scheduleArp(first) {
    const delay = first ? (100 + Math.random() * 80) : (180 + Math.random() * 240) * MODES[currentModeIndex].arpGapMult;
    setTimeout(() => {
      if (inHush() || arpActive) { scheduleArp(false); return; }
      playArp(() => scheduleArp(false));
    }, delay * 1000 * TS);
  }

  // "pssshhh ... pshhh": short filtered-noise releases in a loose rhythm
  function playBursts() {
    const count = 3 + Math.floor(Math.random() * 4);
    const unit = 0.8 + Math.random() * 0.9;
    const gaps = [1, 1, 2, 3];
    let peak = 0.012 + Math.random() * 0.010;
    let when = ctx.currentTime + 0.1;
    for (let i = 0; i < count; i++) {
      const len = 1.6 + Math.random() * 0.9;
      const f1 = 3500 + Math.random() * 3000;
      const f2 = f1 * (0.3 + Math.random() * 0.2);
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer;
      src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass';
      f.Q.value = 0.9;
      f.frequency.setValueAtTime(f1, when);
      f.frequency.exponentialRampToValueAtTime(f2, when + len);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(peak, when + 0.05 + Math.random() * 0.07);
      g.gain.setTargetAtTime(0, when + 0.14, 0.32 + Math.random() * 0.25);
      const panner = ctx.createStereoPanner();
      panner.pan.value = (i % 2 ? 1 : -1) * (0.2 + Math.random() * 0.5);
      src.connect(f).connect(g).connect(panner).connect(masterHighpass);
      src.start(when, Math.random() * 5);
      src.stop(when + len + 0.5);
      peak *= 0.86;
      when += unit * gaps[Math.floor(Math.random() * gaps.length)];
    }
  }

  // three or four tones swelling in together, a soft cluster
  function playCluster() {
    const root = pickVoiceFreq();
    const freqs = [root];
    const c1 = pickCompanion(root, null, 1);
    if (c1) freqs.push(c1);
    const c2 = c1 ? pickCompanion(root, c1, 1) : null;
    if (c2 && c2 !== c1) freqs.push(c2);
    const c3 = c2 ? pickCompanion(root, c2, 1) : null;
    if (c3 && c3 !== c1 && c3 !== c2 && Math.random() < 0.5) freqs.push(c3);
    freqs.forEach((f, i) => {
      setTimeout(() => playVoice({ freq: f, level: 0.8, cap: 6, companion: true }), i * (1500 + Math.random() * 2500));
    });
  }

  // chapter + harmony changes steer the master filter and reverb, slowly
  function applyEnvironment(tc) {
    if (!ctx) return; // not playing yet — new notes simply use the new scale
    const mode = MODES[currentModeIndex];
    const t = ctx.currentTime;
    masterHighpass.frequency.setTargetAtTime(mode.highpassHz, t, tc);
    masterFilter.frequency.setTargetAtTime(mode.filterBaseHz * (1 + chapter.bright * 0.4), t, tc);
    masterFilterDepth.gain.setTargetAtTime(mode.filterSwing, t, tc);
    wetGain.gain.setTargetAtTime(mode.wetBase + chapter.wet, t, tc);
    const bias = mode.revLongBias;
    const depth = Math.min(0.3, bias, 1 - bias);
    revShortGain.gain.setTargetAtTime(1 - bias, t, tc);
    revLongGain.gain.setTargetAtTime(bias, t, tc);
    revDepthShort.gain.setTargetAtTime(depth, t, tc);
    revDepthLong.gain.setTargetAtTime(-depth, t, tc);
    trimGain.gain.setTargetAtTime(mode.outputTrim * TRIM_COMP, t, tc);
  }

  // starts everything that unfolds over time, once audio is running
  function startJourney() {
    journeyStarted = true;
    scheduleChapter();
    scheduleMoment(true);
    scheduleArp(true);
    scheduleBell();
    // handy for testing from the browser console, e.g. haze.arp()
    window.haze = {
      arp: (sec) => playArp(null, sec), bursts: playBursts, hush: startHush, cluster: playCluster,
      bell: playBell, breath: () => playBreath(pickFreq()), chapter: nextChapter,
      drift: driftHarmony, state: () => ({ chapter: chapter.name, harmony, notes: currentNotes.map(f => Math.round(f)) }),
    };
  }

  // ---------- visual: barely-there marks that breathe with each voice ----------
  const shimmer = document.getElementById('shimmer');

  function spawnVisualVoice(attack, hold, release, panCenter) {
    const w = window.innerWidth, h = window.innerHeight;
    const x = (panCenter * 0.5 + 0.5) * w + (Math.random() - 0.5) * w * 0.3;
    const y = h * (0.25 + Math.random() * 0.5);

    const el = document.createElement('div');
    el.className = 'voice-mark';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.opacity = '0';
    document.body.appendChild(el);

    const totalMs = (attack + hold + release) * 1000;
    const start = performance.now();

    function frame(now) {
      const elapsed = now - start;
      let op;
      if (elapsed < attack * 1000) {
        op = (elapsed / (attack * 1000)) * 0.4;
      } else if (elapsed < (attack + hold) * 1000) {
        op = 0.4;
      } else if (elapsed < totalMs) {
        const relElapsed = elapsed - (attack + hold) * 1000;
        op = 0.4 * (1 - relElapsed / (release * 1000));
      } else {
        el.remove();
        return;
      }
      const scale = 1 + Math.sin(elapsed / 4000) * 0.15;
      el.style.opacity = op.toFixed(3);
      el.style.transform = `translate(-50%, -50%) scale(${scale})`;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ---------- grain texture, drawn once, extremely faint ----------
  function drawGrain() {
    const canvas = document.getElementById('grain');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const gctx = canvas.getContext('2d');
    const imgData = gctx.createImageData(canvas.width, canvas.height);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const v = 200 + Math.random() * 55;
      imgData.data[i] = v;
      imgData.data[i + 1] = v;
      imgData.data[i + 2] = v;
      imgData.data[i + 3] = 255;
    }
    gctx.putImageData(imgData, 0, 0);
  }
  drawGrain();

  // ---------- ambient background drift, always running, no audio needed ----------
  const field = document.getElementById('field');
  const fieldB = document.getElementById('fieldB');
  const titleEl = document.getElementById('title');
  let driftT = 0;
  let driftT2 = Math.random() * 10;
  let hueT = Math.random() * 10;
  let hueT2 = Math.random() * 10 + 5;

  // the palette is a blend of the day and night looks; nightAmt eases toward
  // the active mode, so a switch feels like dusk or dawn rather than a cut
  const labelEl = document.getElementById('modeLabel');
  let curShift = chapter.hueShift;

  function driftField() {
    const D = MODES[0], N = MODES[1];
    nightAmt += ((currentModeIndex === 1 ? 1 : 0) - nightAmt) * 0.002;
    curShift += (chapter.hueShift - curShift) * 0.0012;
    const mix = (a, b) => a + (b - a) * nightAmt;

    driftT += 0.0025;
    driftT2 += 0.0017;
    hueT += 0.00035;
    hueT2 += 0.00022;

    const hue = mix(D.hueBase, N.hueBase) + curShift + Math.sin(hueT) * mix(D.hueRange, N.hueRange);
    const sat = mix(D.satBase, N.satBase);
    const x = 50 + Math.sin(driftT) * 6;
    const y = 30 + Math.cos(driftT * 0.7) * 8;
    field.style.background =
      `radial-gradient(ellipse at ${x}% ${y}%, hsl(${hue}, ${sat}%, ${mix(D.light[0], N.light[0])}%) 0%, hsl(${hue + 12}, ${sat - 4}%, ${mix(D.light[1], N.light[1])}%) 50%, hsl(${hue + 24}, ${sat - 8}%, ${mix(D.light[2], N.light[2])}%) 100%)`;

    // a soft glow low in the picture: warm sun-haze by day, a faint blue
    // horizon glow by night
    const x2 = 50 + Math.cos(driftT2 * 0.8) * 10;
    const y2 = 78 + Math.sin(driftT2) * 8;
    const hue2 = mix(D.glowHue, N.glowHue) + Math.sin(hueT2) * mix(D.glowRange, N.glowRange);
    fieldB.style.background =
      `radial-gradient(ellipse at ${x2}% ${y2}%, hsla(${hue2}, ${sat}%, ${mix(D.glow[0], N.glow[0])}%, ${mix(0.55, 0.5).toFixed(2)}) 0%, hsla(${hue2 - 15}, ${sat - 6}%, ${mix(D.glow[1], N.glow[1])}%, ${mix(0.3, 0.3).toFixed(2)}) 60%, transparent 100%)`;

    const breath = 0.4 + Math.sin(driftT * 0.6) * 0.15;
    const tr = Math.round(mix(D.titleColor[0], N.titleColor[0]));
    const tg = Math.round(mix(D.titleColor[1], N.titleColor[1]));
    const tb = Math.round(mix(D.titleColor[2], N.titleColor[2]));
    titleEl.style.color = `rgba(${tr}, ${tg}, ${tb}, ${(breath + nightAmt * 0.1).toFixed(3)})`;
    labelEl.style.color = `rgba(${Math.round(mix(D.labelColor[0], N.labelColor[0]))}, ${Math.round(mix(D.labelColor[1], N.labelColor[1]))}, ${Math.round(mix(D.labelColor[2], N.labelColor[2]))}, ${mix(D.labelColor[3], N.labelColor[3]).toFixed(2)})`;
    requestAnimationFrame(driftField);
  }
  driftField();

  // ---------- fx: stars at night, sun flare and glitter by day ----------
  // both are always running and fade with nightAmt. plucks and bells make
  // a star twinkle at night and brighten the flare by day.
  function initFx() {
    const canvas = document.getElementById('fx');
    const c = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const stars = [];
    for (let i = 0; i < 95; i++) {
      stars.push({
        x: Math.random(), y: Math.pow(Math.random(), 1.3) * 0.88,
        r: 0.4 + Math.random() * 1.1, a: 0.25 + Math.random() * 0.55,
        w: 0.4 + Math.random() * 1.4, ph: Math.random() * 6.28, boost: 0,
      });
    }
    const glints = [];
    for (let i = 0; i < 70; i++) {
      glints.push({
        x: Math.random(), y: 0.55 + Math.random() * 0.45,
        r: 0.5 + Math.random() * 1.2, w: 1.5 + Math.random() * 4,
        ph: Math.random() * 6.28, big: Math.random() < 0.12,
      });
    }
    const ghosts = [
      [0.45, 0.05, [255, 230, 180]], [0.8, 0.09, [190, 225, 255]], [1.15, 0.04, [255, 200, 220]],
      [1.6, 0.07, [255, 240, 200]], [2.0, 0.05, [200, 235, 255]],
    ];
    let flareBoost = 0;
    window._hazePulse = () => {
      flareBoost = Math.min(1, flareBoost + 0.3);
      stars[Math.floor(Math.random() * stars.length)].boost = 1;
    };

    function frame(now) {
      const W = canvas.width, H = canvas.height;
      const tt = now / 1000;
      c.clearRect(0, 0, W, H);
      const night = nightAmt, day = 1 - nightAmt;
      flareBoost *= 0.985;

      if (night > 0.01) {
        for (const st of stars) {
          st.boost *= 0.97;
          const tw = 0.55 + 0.45 * Math.sin(tt * st.w + st.ph);
          const a = Math.min(1, st.a * tw + st.boost * 0.6) * night;
          c.fillStyle = `rgba(214, 226, 255, ${a.toFixed(3)})`;
          c.beginPath();
          c.arc(st.x * W, st.y * H, st.r * (1 + st.boost * 0.8), 0, 6.283);
          c.fill();
        }
      }

      if (day > 0.01) {
        const sx = W * (0.78 + Math.sin(tt * 0.02) * 0.03);
        const sy = H * (0.17 + Math.cos(tt * 0.017) * 0.015);
        const R = Math.min(W, H);
        const boost = 1 + flareBoost * 0.35;

        let g = c.createRadialGradient(sx, sy, 0, sx, sy, R * 0.55);
        g.addColorStop(0, `rgba(255, 250, 235, ${(0.75 * day * boost).toFixed(3)})`);
        g.addColorStop(0.15, `rgba(255, 238, 200, ${(0.38 * day * boost).toFixed(3)})`);
        g.addColorStop(1, 'rgba(255, 230, 190, 0)');
        c.fillStyle = g;
        c.fillRect(0, 0, W, H);

        const sw = W * 1.1;
        g = c.createLinearGradient(sx - sw / 2, 0, sx + sw / 2, 0);
        g.addColorStop(0, 'rgba(255, 245, 225, 0)');
        g.addColorStop(0.5, `rgba(255, 248, 235, ${(0.35 * day * boost).toFixed(3)})`);
        g.addColorStop(1, 'rgba(255, 245, 225, 0)');
        c.fillStyle = g;
        c.fillRect(sx - sw / 2, sy - 1.2, sw, 2.4);

        const cx = W / 2, cy = H / 2;
        ghosts.forEach(([k, rr, col], i) => {
          const gx = sx + (cx - sx) * k, gy = sy + (cy - sy) * k;
          const gr = R * rr * (1 + 0.15 * Math.sin(tt * 0.3 + i));
          const gg = c.createRadialGradient(gx, gy, gr * 0.6, gx, gy, gr);
          gg.addColorStop(0, `rgba(${col[0]}, ${col[1]}, ${col[2]}, 0)`);
          gg.addColorStop(0.85, `rgba(${col[0]}, ${col[1]}, ${col[2]}, ${(0.16 * day * boost).toFixed(3)})`);
          gg.addColorStop(1, `rgba(${col[0]}, ${col[1]}, ${col[2]}, 0)`);
          c.fillStyle = gg;
          c.beginPath();
          c.arc(gx, gy, gr, 0, 6.283);
          c.fill();
        });

        for (const gl of glints) {
          const sn = Math.sin(tt * gl.w + gl.ph);
          if (sn < 0.8) continue;
          const k = (sn - 0.8) / 0.2;
          const a = k * 0.8 * day;
          const gx = gl.x * W, gy = gl.y * H;
          c.fillStyle = `rgba(255, 252, 240, ${a.toFixed(3)})`;
          c.beginPath();
          c.arc(gx, gy, gl.r, 0, 6.283);
          c.fill();
          if (gl.big) {
            const len = 3 + 6 * k;
            c.strokeStyle = `rgba(255, 252, 240, ${(a * 0.7).toFixed(3)})`;
            c.lineWidth = 0.8;
            c.beginPath();
            c.moveTo(gx - len, gy); c.lineTo(gx + len, gy);
            c.moveTo(gx, gy - len); c.lineTo(gx, gy + len);
            c.stroke();
          }
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  initFx();

  // ---------- touch/mouse: an invisible influence, not a control ----------
  function updateBias(clientX, clientY) {
    const nx = (clientX / window.innerWidth) * 2 - 1;
    brightnessBias = nx * 0.6;
  }
  window.addEventListener('mousemove', e => updateBias(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) updateBias(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  setInterval(() => { brightnessBias *= 0.96; }, 500); // slowly forgets

  // ---------- start on first touch ----------
  const enter = document.getElementById('enter');
  // iOS mutes Web Audio when the silent switch is on, unless the page holds
  // a "playback" audio session. a looping silent <audio> element started
  // inside the tap does that; navigator.audioSession does it on newer iOS.
  function makeSilentWavUrl() {
    const sampleRate = 8000, n = 8000;
    const buf = new ArrayBuffer(44 + n);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function unlockMobileAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {
      const a = document.createElement('audio');
      a.src = makeSilentWavUrl();
      a.loop = true;
      a.setAttribute('playsinline', '');
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // dismiss the overlay only once audio is really running; if it isn't
  // after ~1.5s, ask for another tap instead of failing silently
  function watchStart() {
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      if (ctx && ctx.state === 'running') {
        enter.classList.add('gone');
        clearInterval(iv);
      } else if (tries === 5) {
        enter.textContent = 'tap again';
      } else if (tries > 40) {
        enter.classList.add('gone'); // never leave a stuck overlay
        clearInterval(iv);
      }
    }, 300);
  }

  function begin() {
    if (started) {
      if (ctx && ctx.state !== 'running') ctx.resume();
      return;
    }
    started = true;
    try {
      unlockMobileAudio();
      initAudio();
    } catch (err) {
      enter.textContent = 'error: ' + err.message;
      return;
    }
    watchStart();
  }
  // touchend (not touchstart) counts as a user gesture on mobile browsers
  enter.addEventListener('touchend', e => { e.preventDefault(); begin(); }, { passive: false });
  enter.addEventListener('click', begin);

  // any later tap also nudges a suspended context awake, and so does
  // coming back to the tab
  function nudgeAudio() {
    if (ctx && ctx.state !== 'running') ctx.resume();
  }
  window.addEventListener('touchend', nudgeAudio, { passive: true });
  window.addEventListener('click', nudgeAudio);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) nudgeAudio();
  });

  // ---------- mode cycling ----------
  const modeLabel = document.getElementById('modeLabel');
  // a two-way toggle: the active word is clear, the other is dimmed
  function updateModeLabel() {
    modeLabel.querySelectorAll('span[data-m]').forEach(el => {
      el.style.opacity = Number(el.dataset.m) === currentModeIndex ? '1' : '0.38';
    });
  }
  updateModeLabel();
  function cycleMode() {
    currentModeIndex = (currentModeIndex + 1) % MODES.length;
    harmony = { rootOffset: 0, scaleIdx: 0 };
    currentNotes = computeNotes(currentModeIndex, 0, 0);
    rebuildScale();
    chapterIdx = 0;
    chapter = CHAPTERS[0];
    if (journeyStarted) scheduleChapter();
    applyEnvironment(6);
    updateModeLabel();
    if (ctx && ctx.state !== 'running') ctx.resume();
  }
  modeLabel.addEventListener('touchend', e => { e.preventDefault(); cycleMode(); }, { passive: false });
  modeLabel.addEventListener('click', cycleMode);

})();
</script>
</body>
</html>
