<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RKVV Casteren · Kantinescherm</title>
<link href="https://fonts.googleapis.com/css?family=Anton|Barlow+Condensed:600,700,800|Caveat+Brush" rel="stylesheet">
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:none}
body{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#111}
.A{font-family:Anton,Impact,sans-serif;font-weight:400}
.C{font-family:'Caveat Brush',cursive;font-weight:400}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;background:#F7F4EC;overflow:hidden}

/* bovenbalk */
#bar{position:absolute;left:0;top:0;width:1920px;height:124px;background:#111;border-bottom:8px solid #E6D74F;z-index:8}
#tickwrap{position:absolute;left:270px;top:16px;height:100px;overflow:hidden}
#ticker{position:absolute;top:24px;left:0;white-space:pre;font-size:40px;font-weight:700;color:#fff;line-height:52px;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
#clockbox{position:absolute;right:0;top:16px;height:100px;background:#1f1f1f;padding:0 38px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#date{font-size:26px;font-weight:600;color:#a8a8a8;margin-right:20px}
#clock{font-size:40px;color:#E6D74F}
#badge{position:absolute;left:46px;top:20px;width:162px;height:162px;border-radius:50%;background:#fff;box-shadow:0 16px 36px rgba(0,0,0,.26);z-index:9}
#badge img{position:absolute;left:-2px;right:0;top:-5px;bottom:0;margin:auto;width:160px;height:171px;-webkit-transform:translateX(-8px);transform:translateX(-8px)}

/* slides */
.slide{position:absolute;left:0;top:124px;width:1920px;height:956px;opacity:0;-webkit-transition:opacity 1.2s ease;transition:opacity 1.2s ease}
.slide.on{opacity:1}

/* sponsors */
.tile{position:absolute}
.flip{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform;-webkit-backface-visibility:hidden;-webkit-transition:-webkit-transform .32s ease-in;transition:transform .32s ease-in}
.card{position:absolute;left:0;top:0;width:100%;height:100%;background:#fff;border-radius:22px;padding:26px 30px;border:2px solid #ebe5d6}
.card img{width:100%;height:100%;object-fit:contain;display:block}
.naam{position:absolute;left:16px;right:16px;top:0;bottom:0;display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;font-size:46px;line-height:1.15;color:#25231f}
.leeg{position:absolute;left:0;top:0;width:100%;height:100%;background:#CE2130;border-radius:22px;color:#fff;text-align:center;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center}

/* teamfoto */
#teamphoto{max-width:100%;max-height:100%;width:auto;height:auto;display:block}

@-webkit-keyframes tick{from{-webkit-transform:translate3d(0,0,0)}to{-webkit-transform:translate3d(-50%,0,0)}}
@keyframes tick{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
</style>
</head>
<body>
<div id="stage">

  <div id="bar">
    <div id="tickwrap"><span id="ticker"></span></div>
    <div id="clockbox"><span id="date"></span><span id="clock" class="A"></span></div>
  </div>
  <div id="badge"><img src="img/s/logo.png" alt="RKVV Casteren"></div>

  <!-- SLIDE: welkom — sfeerfoto's: zie WELKOM_FOTOS -->
  <div class="slide" id="welkom" style="background:#fff">
    <div style="position:absolute;left:250px;top:0;width:1670px;height:956px;overflow:hidden">
      <img class="wf" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;-webkit-transition:opacity 1.5s ease;transition:opacity 1.5s ease">
      <img class="wf" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;-webkit-transition:opacity 1.5s ease;transition:opacity 1.5s ease">
    </div>
    <div style="position:absolute;left:100px;top:0;width:840px;height:956px;z-index:2;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center">
      <div class="C" style="font-size:56px;color:#CE2130;line-height:1.1">Welkom op Sportpark De Smeel</div>
      <div class="A" style="font-size:132px;line-height:1.02;margin-top:16px">RKVV CASTEREN<br>HEET U WELKOM</div>
      <div style="width:140px;height:8px;background:#E6D74F;margin:40px 0"></div>
      <div style="display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center">
        <div style="width:340px;height:340px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin-right:40px">
          <img src="img/s/logo.png" alt="RKVV Casteren" style="width:300px;height:auto">
        </div>
        <div style="width:340px;height:340px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center">
          <img src="img/casnetlogo.png" onerror="if(this.src.indexOf('humanmotives')<0)this.src='https://humanmotives.org/rkvv/img/casnetlogo.png'" alt="Jeugdvoetbal Casteren/Netersel" style="width:340px;height:auto">
        </div>
      </div>
    </div>
  </div>

  <!-- SLIDE: sponsor worden -->
  <div class="slide" id="worden" style="background:#CE2130">
    <div style="position:absolute;right:-240px;top:-260px;width:900px;height:900px;border-radius:50%;border:90px solid rgba(255,255,255,.08)"></div>
    <img src="img/s/voetbal.png" onerror="this.style.display='none'" alt="" style="position:absolute;right:220px;bottom:150px;width:300px">
    <div style="position:absolute;left:140px;top:0;width:1200px;height:956px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center">
      <div class="C" style="font-size:64px;color:#E6D74F;line-height:1">Steun de club</div>
      <div class="A" style="font-size:170px;line-height:1.02;color:#fff;margin-top:14px">SPONSOR<br>WORDEN?</div>
      <div style="width:140px;height:8px;background:#E6D74F;margin:40px 0 34px"></div>
      <div style="font-size:56px;font-weight:700;color:#fff;line-height:1.2">Vraag iemand van ons bestuur voor info.</div>
    </div>
  </div>

  <!-- SLIDE: video -->
  <div class="slide" id="video" style="background:#000">
    <video id="vid" muted playsinline preload="auto" style="position:absolute;left:0;top:0;width:1920px;height:956px;object-fit:cover"></video>
  </div>

  <!-- SLIDE 1: alle sponsors -->
  <div class="slide" id="sponsors">
    <div style="position:absolute;left:70px;top:118px">
      <span class="A" style="font-size:104px;line-height:1">ONZE SPONSOREN</span>
      <span class="C" style="font-size:62px;color:#CE2130;margin-left:30px">bedankt!</span>
    </div>
    <div id="grid" style="position:absolute;left:70px;top:290px;width:1780px;height:540px"></div>
  </div>

  <!-- SLIDE 2: teamfoto -->
  <div class="slide" id="team" style="background:#fff">
    <img id="teamwm" src="img/casnetlogo.png" alt="" style="position:absolute;left:-220px;top:50%;width:1150px;margin-top:-575px;opacity:.12">
    <div style="position:absolute;left:24px;top:20px;width:1326px;height:916px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center">
      <img id="teamphoto" src="" alt="">
    </div>
    <div style="position:absolute;left:1390px;top:84px;width:490px;height:790px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center">
      <div style="font-size:26px;font-weight:800;letter-spacing:.22em;color:#CE2130">TEAMFOTO · <span id="seizoen"></span></div>
      <div id="teamnaam" class="A" style="font-size:104px;line-height:1.02;margin-top:10px"></div>
      <div id="club" class="C" style="font-size:52px;color:#CE2130;line-height:1.1"></div>
      <img id="teamlogo" alt="" style="width:240px;height:auto;margin-top:36px;display:block">
    </div>
  </div>

</div>

<script>
/* =====================================================
   INSTELLINGEN — alleen hier iets aanpassen
   ===================================================== */

var TICKER = "Welkom bij RKVV Casteren    •   Let op dat je nog even niet over het ingezaaide gras loopt    •   De officiële opening is op 10 oktober    •   Wil jij bij de club van 50? Vraag aan de bar    •   ";

var SPONSOR_SECONDEN = 7;   // hoe lang elke groep van 8 sponsors staat (40 sponsors = 5 groepen)
var TEAM_SECONDEN = 10;     // hoe lang een teamfoto staat
var TEAMS_PER_KEER = 3;     // aantal teamfoto's na elkaar
var WELKOM_SECONDEN = 10;   // welkomstscherm
var WORDEN_SECONDEN = 10;   // "Sponsor worden?" — komt één keer per ronde
var WELKOM_FOTOS = ["welkom.jpg", "welkom1.jpg", "welkom2.jpg", "welkom3.jpg", "welkom4.jpg"];  // in img/, elke keer de volgende
var VIDEO = "";                 // bijv. "video/drone.mp4" — leeg = geen video
var VIDEO_MAX_SECONDEN = 90;    // langer duurt hij nooit; lukt afspelen niet, dan wordt hij overgeslagen

// Sponsors: [naam, bestand in img/sponsors/]. Vaste volgorde. Geen logo? Dan toont het kaartje de naam.
var SPONSORS = [
  ["Audioworkx Studio Design", "sponsor-audioworkx.png"],
  ["Autocare Jan van Rooy", "sponsor-autocarevanrooy.png"],
  ["Autoservice Casteren", "sponsor-autoservicecasteren.jpg"],
  ["Connectro", "sponsor-connectro.png"],
  ["Corstiaans Schilderwerken", "sponsor-corstiaans.jpg"],
  ["Den Bels", "sponsor-denbels.jpg"],
  ["Esco Vloeren", "sponsor-esco.png"],
  ["ExKuus", "sponsor-excuus.png"],
  ["Feltek", "sponsor-feltek.png"],
  ["Fysiocenter Hapert", "sponsor-fysiocenterhapert.png"],
  ["Gijsbers", "sponsor-gijsbers.png"],
  ["Gooskens Hout", "sponsor-gooskens.jpg"],
  ["Hamax Technical Solutions", "sponsor-hamax.png"],
  ["Harry Rombouts en Zn.", "sponsor-rombouts.png"],
  ["Hendriks Installatie", "sponsor-hendriks.jpg"],
  ["Heuveling Containerverhuur", "sponsor-heuveling.jpg"],
  ["Hoeks Grondwerken", "sponsor-hoeks.png"],
  ["Huybers", "sponsor-huybers.png"],
  ["Hypotheekhulp.nl", "sponsor-hypotheekhulp.jpg"],
  ["Lamers & Van de Wijdeven", "sponsor-lamers.jpg"],
  ["Landleven Versspeciaalzaak", "sponsor-landleven.png"],
  ["Libra ICT", "sponsor-libraict.png"],
  ["Mark van de Pas Bouwbedrijf", "sponsor-markvdpas.jpg"],
  ["P. van Hulst", "sponsor-pvanhulst.png"],
  ["R&C Logistiek", "sponsor-rclogistiek.png"],
  ["RB Bouw", "sponsor-rbbouw.png"],
  ["Roko Lastechniek", "sponsor-roko.jpg"],
  ["Roy Wouters Grondwerken", "sponsor-roywouters.jpg"],
  ["Smits Water Solutions", "sponsor-smitswater.jpg"],
  ["Smolders Agri Service", "sponsor-agroservice.png"],
  ["Tax Stuckwerk", "sponsor-taxstucwerken.jpg"],
  ["TDS Truckdoor Service", "sponsor-tds.png"],
  ["Teurlings de Mulder", "sponsor-teurlings.jpg"],
  ["Van Dingenen Transport", "sponsor-vdt.png"],
  ["Van Gils Electro", "sponsor-vangils.png"],
  ["Van Lieshout", "sponsor-vanlieshout.png"],
  ["Verhoeven", "sponsor-verhoeven.jpg"],
  ["Wintermans Eersel", "sponsor-wintermans.png"],
  ["Yimo Sierbestrating", "sponsor-yimo.png"],
  ["Zorgboerderij de Wederloop", "sponsor-wederloop.png"]
];

// Teamfoto's. Per groep: map, club, watermerk en de teams [teamnaam, bestandsnaam].
var SEIZOEN = "2026/27";
var JEUGD = {
  map: "img/teamfotos/casnet26/", club: "Casteren/Netersel", watermerk: "img/casnetlogo.png",
  teams: [
    ["JO7", "1.jpg"], ["JO8", "2.jpg"], ["JO9", "3.jpg"], ["JO10-1", "4.jpg"], ["JO10-2", "5.jpg"],
    ["JO11", "6.jpg"], ["JO12", "7.jpg"], ["JO14", "8.jpg"], ["JO15", "9.jpg"], ["JO19", "10.jpg"]
  ]
};
var SENIOREN = {
  map: "img/teamfotos/2025/", club: "RKVV Casteren", watermerk: "img/s/logo.png", seizoen: "2025",
  teams: [
    ["Casteren 1", "RKVV-2025-1e.jpg"],
    ["Casteren 2", "RKVV-2025-2e.jpg"],
    ["Casteren 3", "RKVV-2025-3e.jpg"],
    ["Casteren 4", "RKVV-2025-4e.png"],
    ["Dames", "RKVV-2025-Dames.jpg"]
  ]
};

/* ===================================================== */

// Reserve-adres: als een afbeelding lokaal ontbreekt, wordt hij van de live site gehaald.
var LIVE = "https://humanmotives.org/rkvv/";

(function () {
  function $(id) { return document.getElementById(id); }
  function anim(el, v) { el.style.webkitAnimation = v; el.style.animation = v; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  // schalen naar scherm
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    $('stage').style.webkitTransform = 'scale(' + s + ')';
    $('stage').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  // klok
  var DAGEN = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
  var MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
  function klok() {
    var d = new Date(), m = d.getMinutes();
    $('clock').innerHTML = d.getHours() + ':' + (m < 10 ? '0' : '') + m;
    $('date').innerHTML = DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()];
  }
  klok(); setInterval(klok, 10000);

  // ticker (loopt naadloos door)
  $('tickwrap').style.right = $('clockbox').offsetWidth + 'px';
  $('ticker').innerHTML = esc(TICKER) + esc(TICKER);
  anim($('ticker'), 'tick ' + Math.max(10, Math.round($('ticker').offsetWidth / 2 / 90)) + 's linear infinite');

  // sponsorgrid: 5 x 4 kaartjes
  var COLS = 4, ROWS = 2, N = COLS * ROWS, W = 425, H = 250, GX = 26, GY = 40;
  var groepen = Math.max(1, Math.ceil(SPONSORS.length / N));
  var html = '';
  for (var n = 0; n < N; n++) {
    html += '<div class="tile" style="left:' + (n % COLS) * (W + GX) + 'px;top:' + Math.floor(n / COLS) * (H + GY) + 'px;width:' + W + 'px;height:' + H + 'px">' +
      '<div class="flip"><div class="card"><img alt=""><div class="naam A"></div></div>' +
      '<div class="leeg"><div class="A" style="font-size:52px;line-height:1.1">JOUW LOGO?</div><div style="font-size:28px;font-weight:600;margin-top:6px">info@rkvvcasteren.nl</div></div></div></div>';
  }
  $('grid').innerHTML = html;
  // alle sponsorlogo's vooraf laden, zodat het omdraaien niet hapert
  var voorraad = [];
  for (var v = 0; v < SPONSORS.length; v++) { var im = new Image(); im.src = 'img/sponsors/' + SPONSORS[v][1]; voorraad.push(im); }
  var tiles = $('grid').querySelectorAll('.flip');
  for (var t = 0; t < tiles.length; t++) (function (el) {
    var img = el.querySelector('img');
    img.onerror = function () {
      // lokaal niet gevonden? probeer de live site, anders naam tonen
      if (img.src.indexOf(LIVE) !== 0 && img.getAttribute('data-f')) { img.src = LIVE + 'img/sponsors/' + img.getAttribute('data-f'); return; }
      img.style.display = 'none'; el.querySelector('.naam').style.display = '-webkit-flex'; el.querySelector('.naam').style.display = 'flex';
    };
  })(tiles[t]);

  function vul(el, sp) {
    var card = el.querySelector('.card'), leeg = el.querySelector('.leeg');
    if (!sp) { card.style.display = 'none'; leeg.style.display = '-webkit-flex'; leeg.style.display = 'flex'; return; }
    card.style.display = ''; leeg.style.display = 'none';
    var img = el.querySelector('img'), naam = el.querySelector('.naam');
    naam.innerHTML = esc(sp[0]); naam.style.display = 'none';
    img.style.display = ''; img.alt = sp[0]; img.setAttribute('data-f', sp[1]); img.src = 'img/sponsors/' + sp[1];
  }
  function toonGroep(g, draai) {
    for (var i = 0; i < tiles.length; i++) (function (el, i) {
      var sp = SPONSORS[g * N + i] || null;
      if (!draai) { vul(el, sp); return; }
      setTimeout(function () {
        el.style.webkitTransform = 'scaleX(0)'; el.style.transform = 'scaleX(0)';
        setTimeout(function () { vul(el, sp); el.style.webkitTransform = 'scaleX(1)'; el.style.transform = 'scaleX(1)'; }, 330);
      }, i * 60);
    })(tiles[i], i);
  }

  // teamfoto
  function toonTeam(groep) {
    groep.nr = groep.nr || 0;
    var tm = groep.teams[groep.nr++ % groep.teams.length], tp = $('teamphoto'), wm = $('teamwm');
    tp.onerror = function () { if (tp.src.indexOf(LIVE) !== 0) tp.src = LIVE + groep.map + tm[1]; };
    tp.src = groep.map + tm[1];
    wm.onerror = function () { if (wm.src.indexOf(LIVE) !== 0) wm.src = LIVE + groep.watermerk; };
    wm.src = groep.watermerk;
    $('teamnaam').innerHTML = esc(tm[0]);
    $('club').innerHTML = esc(groep.club);
    var tl = $('teamlogo');
    tl.onerror = function () { if (tl.src.indexOf(LIVE) !== 0) tl.src = LIVE + groep.watermerk; };
    tl.src = groep.watermerk;
    $('seizoen').innerHTML = esc(groep.seizoen || SEIZOEN);
  }

  // afspelen
  var SLIDES = ['welkom', 'sponsors', 'team', 'video', 'worden'];
  function toon(id) {
    for (var i = 0; i < SLIDES.length; i++) $(SLIDES[i]).className = 'slide' + (SLIDES[i] === id ? ' on' : '');
  }
  // welkomstfoto's: wisselen tijdens het scherm (crossfade), en gaan verder waar ze waren (ook na herladen)
  var welkomNr = Math.floor(Date.now() / 7000), laag = 0, wfTimer = null;
  var lagen = document.querySelectorAll('#welkom .wf');
  function volgendeFoto() {
    var naam = WELKOM_FOTOS[welkomNr++ % WELKOM_FOTOS.length], nieuw = lagen[laag], oud = lagen[1 - laag];
    laag = 1 - laag;
    nieuw.onerror = function () { if (nieuw.src.indexOf(LIVE) !== 0) nieuw.src = LIVE + 'img/' + naam; };
    nieuw.onload = function () { nieuw.style.opacity = 1; oud.style.opacity = 0; };
    nieuw.src = 'img/' + naam;
  }
  function welkom(klaar) {
    toon('welkom');
    volgendeFoto();
    wfTimer = setInterval(volgendeFoto, Math.max(4, WELKOM_SECONDEN / 2) * 1000);
    setTimeout(function () { clearInterval(wfTimer); klaar(); }, WELKOM_SECONDEN * 1000);
  }
  function worden(klaar) { toon('worden'); setTimeout(klaar, WORDEN_SECONDEN * 1000); }
  function sponsors(klaar) {
    toonGroep(0, false); toon('sponsors');
    var g = 0;
    (function volgende() {
      setTimeout(function () {
        g++;
        if (g < groepen) { toonGroep(g, true); volgende(); } else klaar();
      }, SPONSOR_SECONDEN * 1000);
    })();
  }
  function teamsVan(groep) {
    return function (klaar) {
      if (!groep.teams.length) return klaar();
      var n = 0;
      (function volgende() {
        if (n++ >= TEAMS_PER_KEER) return klaar();
        toonTeam(groep); toon('team');
        setTimeout(volgende, TEAM_SECONDEN * 1000);
      })();
    };
  }
  function video(klaar) {
    var v = $('vid'), klaarGeroepen = false, wacht;
    if (!VIDEO) return klaar();
    function stop() {
      if (klaarGeroepen) return; klaarGeroepen = true;
      clearTimeout(wacht); try { v.pause(); } catch (e) {}
      v.onended = v.onerror = null; klaar();
    }
    v.onended = stop;
    v.onerror = stop;
    v.src = VIDEO;
    try { v.currentTime = 0; } catch (e) {}
    var pr = v.play && v.play();
    if (pr && pr['catch']) pr['catch'](stop);
    // pas tonen als hij echt speelt; anders na 6 sec overslaan
    var check = setTimeout(function () { if (v.paused || v.readyState < 2) stop(); }, 6000);
    v.onplaying = function () { clearTimeout(check); toon('video'); };
    wacht = setTimeout(stop, VIDEO_MAX_SECONDEN * 1000);
  }
  // volgorde: welkom → sponsors → jeugd → sponsors → sponsor worden → senioren → (video) → opnieuw
  var VOLGORDE = [welkom, sponsors, teamsVan(JEUGD), sponsors, worden, teamsVan(SENIOREN), video];
  // Testen via de link: ?alleen=welkom | sponsors | jeugd | senioren
  var alleen = window.ALLEEN || (location.search.match(/[?&]alleen=([a-z]+)/) || [])[1];
  var LOS = { welkom: welkom, worden: worden, sponsors: sponsors, jeugd: teamsVan(JEUGD), senioren: teamsVan(SENIOREN) };
  if (alleen && LOS[alleen]) VOLGORDE = [LOS[alleen]];
  var stap = 0;
  (function volgende() { VOLGORDE[stap++ % VOLGORDE.length](volgende); })();

  // elk uur herladen zodat nieuwe uploads binnenkomen
  setTimeout(function () { location.reload(); }, 60 * 60000);
})();
</script>
</body>
</html>
