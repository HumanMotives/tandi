<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOID KULTUR — THE RECONSTRUCTION OF THE VOID</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Baskerville:ital@0;1&family=Barlow+Condensed:wght@500;600;700&display=swap');
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#070707;color:#f1eee8;font-family:'IBM Plex Mono',monospace;overflow:hidden}
#scene{position:fixed;inset:0;overflow:hidden;background:#090909}.visual{position:absolute;inset:-5%;background:center/cover no-repeat;opacity:0;transform:scale(1.035);filter:brightness(.31) saturate(.58) contrast(1.08);transition:opacity 3.8s ease;will-change:transform,opacity}.visual.active{opacity:1;animation:slowZoom 28s ease-in-out infinite alternate}@keyframes slowZoom{from{transform:scale(1.035)}to{transform:scale(1.095)}}
#scene:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,4,4,.84),rgba(4,4,4,.52) 43%,rgba(4,4,4,.28) 72%,rgba(4,4,4,.62)),linear-gradient(0deg,rgba(4,4,4,.78),transparent 45%,rgba(4,4,4,.18));pointer-events:none}#grain{position:fixed;inset:0;z-index:2;opacity:.10;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.035) 4px)}
#story{position:fixed;z-index:4;left:15vw;top:47%;transform:translateY(-50%);width:min(720px,55vw);will-change:transform}.label{font-size:10px;letter-spacing:.18em;color:#9d9d9d;margin-bottom:20px}h1{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(48px,5.25vw,86px);line-height:.98;letter-spacing:.01em;margin:0 0 30px;text-transform:uppercase}h1 .accent{color:#ff5658}#text{max-width:670px;margin:0;font-family:'Libre Baskerville',serif;font-style:italic;font-size:clamp(19px,1.7vw,28px);line-height:1.58;color:#e2d6c6;text-shadow:0 2px 12px #000}
#chapter,#text{transition:opacity 1.15s ease,transform 1.15s ease}#chapter.story-out,#text.story-out{opacity:0;transform:translateY(10px)}#chapter.story-in,#text.story-in{opacity:1;transform:translateY(0)}
.glitch{position:relative;display:inline-block}.glitch.flash{animation:glitchFlash .14s steps(2,end)}@keyframes glitchFlash{0%{transform:translate(0)}30%{transform:translate(-2px,1px);text-shadow:2px 0 #ff5658,-2px 0 #63d6e6;font-family:'IBM Plex Mono',monospace}60%{transform:translate(2px,-1px);text-shadow:-2px 0 #ff5658,2px 0 #63d6e6}100%{transform:translate(0);text-shadow:none}}
#player{position:fixed;z-index:6;left:10.5vw;right:10.5vw;bottom:8vh;display:grid;grid-template-columns:1fr 185px;column-gap:48px;align-items:end}#player-main{min-width:0}#nowplaying{display:flex;align-items:center;gap:20px;min-width:0}#play{width:76px;height:76px;border:0;border-radius:50%;background:#f4f4f2;color:#070707;font-size:31px;line-height:1;cursor:pointer;flex:0 0 auto;padding:0 0 0 4px}#play.stop{font-size:28px;padding:0}.meta{min-width:0;flex:1}.track-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:18px}#title{font-size:clamp(18px,1.75vw,29px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f2efeb}.progress-row{display:flex;align-items:center;gap:18px}#seek{width:100%;height:18px;margin:0;appearance:none;background:transparent;cursor:pointer}#seek::-webkit-slider-runnable-track{height:5px;background:linear-gradient(to right,#e9e9e9 0%,#e9e9e9 var(--progress,0%),#85858a var(--progress,0%),#85858a 100%)}#seek::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border-radius:50%;background:#f3f3f1;margin-top:-8.5px}#time{font-size:16px;color:#e9e6e0;white-space:nowrap}#tracklist{display:flex;flex-wrap:wrap;gap:9px 24px;margin:16px 0 0 96px}.track-item{appearance:none;border:0;background:transparent;color:#a7a5a2;font:14px 'IBM Plex Mono',monospace;letter-spacing:.04em;padding:0;cursor:pointer;white-space:nowrap}.track-item .track-num{color:#ff5658;margin-right:7px}.track-item:hover{color:#fff}.track-item.active{color:#f1eee8}#cover-wrap{align-self:end;width:185px}#cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media(max-width:900px){#story{left:8vw;width:74vw}#player{left:7vw;right:7vw;bottom:6vh;grid-template-columns:1fr 120px;column-gap:24px}#cover-wrap{width:120px}#tracklist{margin-left:96px}#next{display:none}}
@media(max-width:640px){#story{left:7vw;right:7vw;width:auto;top:39%;transform:translateY(-50%)}.label{font-size:8px;margin-bottom:14px}h1{font-size:12.5vw;margin-bottom:22px;line-height:1}#text{font-size:16px;line-height:1.5}#player{left:6vw;right:6vw;bottom:4vh;display:block}#cover-wrap{display:none}#play{width:58px;height:58px;font-size:24px}#nowplaying{gap:14px}.track-heading{margin-bottom:10px}#title{font-size:15px}#time{font-size:11px}#tracklist{margin:14px 0 0 72px;gap:6px 14px;max-height:38px;overflow:hidden}.track-item{font-size:10px}}
.chapter-letter{display:inline-block;opacity:0;transform:translateY(.22em);filter:blur(4px);animation:chapterLetterIn 1.25s cubic-bezier(.16,.84,.28,1) forwards}.chapter-space{display:inline-block;width:.28em}@keyframes chapterLetterIn{from{opacity:0;transform:translateY(.22em);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
</style>
</head>
<body>
<div id="scene"><div id="a" class="visual active"></div><div id="b" class="visual"></div></div><div id="grain"></div>
<section id="story"><h1 id="chapter"><span class="accent">PRIVATE DEMO</span><br>UPCOMING EP TITLE</h1><p id="text">PRESS PLAY</p></section>
<div id="player"><div id="player-main"><div id="nowplaying"><button id="play" aria-label="Play">▶</button><div class="meta"><div class="track-heading"><div id="title">01: UR INERTIA</div></div><div class="progress-row"><input id="seek" type="range" min="0" max="100" value="0"><div id="time">0:00</div></div></div></div><div id="tracklist"></div></div><div id="cover-wrap"><img id="cover" src="https://www.humanmotives.org/vk/story/imgs/void%20kultur%20ep%20cover.jpg" alt="VOID KULTUR EP artwork"></div></div>
<audio id="audio" preload="metadata"></audio>
<script>
const R='https://pub-6257dc8d604340e19374e8ef6388c733.r2.dev/vkep/', IMG='https://www.humanmotives.org/vk/story/imgs/';
const tracks=[
{name:'UR INERTIA',file:'VK-EP-TRACK01-MIX1.mp3',img:'vk-epstory-voidwalker.jpg',moments:[[0,'<span class="accent">THE VOID CRACKED.</span><br>LIGHT ENTERED<br>THE WORLD','The world below is fractured. Culture: a dead shell of neon and static, worshipped without thought.'],[20,'<span class="accent">EXILE</span><br>BEGINS','At the altar of this civilization, rupture occurs. Consciousness retreats into the deep.'],[45,'<span class="accent">A NOMAD</span><br>AT ABSOLUTE ZERO','Earthly noise fades into the void. No breath. No memory.']]},
{name:'LIGHT OF MAN',file:'VOID%20KULTUR%20-%20EP%20-%20LIGHT%20OF%20MAN%20-%20DEMO.mp3',img:'vk-epstory-pilgrimreachesforlight.jpg',moments:[[0,'<span class="accent">A SIGNAL</span><br>IN THE VOID','A light pulse breaks the silence. An inner calling takes hold, driving the nomad forward.']]},
{name:'GLEIS EMANAT',file:'VK-EP-TRACK03-MIX1.mp3',img:'vk-epstory-setfoot.jpg',moments:[[0,'<span class="accent">REASON</span><br>FRACTURES','Logic implodes under vacuum pressure. Reason fractures.']]},
{name:'KANTATE TRANSORMATA',file:'VOID%20KULTUR%20-%20EP%20-%20TRACK-4.mp3',img:'vk-epstory-mindsnake.jpg',moments:[[0,'<span class="accent">THE UNKNOWN</span><br>REVEALS ITSELF','Occult revelation strikes the core of consciousness.']]},
{name:'ASTRALICH ABSOLUTUM',file:'VOID%20KULTUR%20-%20EP%20-%20ASTRALICH.mp3',img:'vk-epstory-pelgrimreachesforlight.jpg',moments:[[0,'<span class="accent">FORM</span><br>IS ERASED','The nomad sheds physical form and collapses into a boundless expanse of light.']]},
{name:"ROKO'S BASILISK",file:'VOID%20KULTUR%20-%20EP%20-%20TRACK6.mp3',img:'vk-epstory-basilisk2.jpg',moments:[[0,'<span class="accent">THE MACHINE</span><br>IS ETERNAL','The pilgrimage was a trap. The machine is eternal. The Basilisk is absolute.']]}
];
const audio=document.querySelector('#audio'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),tracklist=document.querySelector('#tracklist'),title=document.querySelector('#title'),chapter=document.querySelector('#chapter'),text=document.querySelector('#text'),time=document.querySelector('#time'),a=document.querySelector('#a'),b=document.querySelector('#b');
let i=0,lastMoment=-1,useA=true,storyTimer;
function fmt(s){return Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00'}
function flashWords(){const candidates=[...chapter.querySelectorAll('.accent'),...chapter.querySelectorAll('.chapter-letter'),chapter,text].filter(Boolean);const el=candidates[Math.floor(Math.random()*candidates.length)];el.classList.remove('flash');void el.offsetWidth;el.classList.add('glitch','flash')}
setInterval(()=>{if(!audio.paused&&Math.random()>.35)flashWords()},2100);

/* Animate only text nodes. Existing spans and BR tags remain real HTML elements. */
function animateLetters(root){
 const textNodes=[];
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()) textNodes.push(walker.currentNode);
 let n=0;
 textNodes.forEach(node=>{
   const value=node.nodeValue;
   if(value==='') return;
   const frag=document.createDocumentFragment();
   Array.from(value).forEach(char=>{
     const span=document.createElement('span');
     if(char===' '){
       span.className='chapter-space'; span.innerHTML='&nbsp;';
     }else{
       span.className='chapter-letter'; span.textContent=char;
       span.style.animationDelay=(n*.042 + Math.random()*.22)+'s';
       n++;
     }
     frag.appendChild(span);
   });
   node.replaceWith(frag);
 });
}
function animateStory(m){
 clearTimeout(storyTimer);chapter.classList.add('story-out');text.classList.add('story-out');
 storyTimer=setTimeout(()=>{
   chapter.innerHTML=m[1]; animateLetters(chapter); text.textContent=m[2];
   chapter.classList.remove('story-out');text.classList.remove('story-out');chapter.classList.add('story-in');text.classList.add('story-in');
 },900);
}
function setProgress(){const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;seek.value=pct;seek.style.setProperty('--progress',pct+'%');time.textContent=fmt(audio.currentTime)}
function updateButtons(){[...tracklist.children].forEach((x,n)=>x.classList.toggle('active',n===i))}
function setBackground(url){const incoming=useA?b:a,outgoing=useA?a:b;incoming.style.backgroundImage=`url("${url}")`;incoming.classList.add('active');outgoing.classList.remove('active');useA=!useA}
function load(n,autoplay=false){i=n;lastMoment=-1;const t=tracks[i];audio.pause();audio.src=R+t.file;audio.load();title.textContent=String(i+1).padStart(2,'0')+': '+t.name;animateStory(t.moments[0]);seek.value=0;seek.style.setProperty('--progress','0%');time.textContent='0:00';updateButtons();setBackground(IMG+t.img);if(autoplay)audio.play().catch(()=>{})}
tracks.forEach((t,n)=>{const btn=document.createElement('button');btn.className='track-item';btn.innerHTML='<span class="track-num">'+String(n+1).padStart(2,'0')+'</span><span>'+t.name+'</span>';btn.onclick=()=>load(n,true);tracklist.appendChild(btn)});
play.onclick=()=>{if(!audio.src)load(0);audio.paused?audio.play().catch(()=>{}):audio.pause()};audio.onplay=()=>{play.textContent='■';play.classList.add('stop')};audio.onpause=()=>{play.textContent='▶';play.classList.remove('stop')};audio.ontimeupdate=()=>{setProgress();const ms=tracks[i].moments;const m=ms.filter(x=>x[0]<=audio.currentTime).pop();if(m&&m[0]!==lastMoment){lastMoment=m[0];animateStory(m)}};seek.oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*(seek.value/100);setProgress()};audio.onended=()=>{if(i<tracks.length-1)load(i+1,true);else{audio.currentTime=0;setProgress()}};
// Keep the opening screen as a private demo prompt until the listener starts a track.
setBackground(IMG+tracks[0].img);
</script></body></html>
