<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VK miner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #23262e; --surface: #2c3039; --line: #3b404b;
  --ink: #ebe6dc; --muted: #9a9fa9;
  --glow: #b7a4e3; --keep: #8fbfa6; --drop: #cf8a80;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 140px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar { max-width: 760px; margin: 0 auto; padding: 14px 18px 12px; }
h1 { margin: 0; font: 500 1.05rem/1.3 var(--sans); }
h1 select { font-weight: 500; max-width: 100%; }
.sub { color: var(--muted); font-size: .85rem; margin-top: 2px; overflow-wrap: anywhere; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.actions { display: flex; gap: 8px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: default; }

main { max-width: 760px; margin: 0 auto; padding: 6px 18px 60px; }
.clip {
  display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px;
  padding: 18px 0 16px 12px; border-bottom: 1px solid var(--line);
  border-left: 3px solid transparent; margin-left: -15px;
}
.clip.current { border-left-color: var(--glow); }
.clip[data-state="keep"] .quote { color: var(--keep); }
.clip[data-state="drop"] { opacity: .45; }
.play {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; display: grid; place-items: center;
}
.play svg { width: 14px; height: 14px; fill: var(--ink); }
.clip.playing .play { border-color: var(--glow); box-shadow: 0 0 0 4px rgba(183,164,227,.18); }
.quote {
  font: italic 400 1.38rem/1.35 var(--serif); margin: 4px 0 8px; max-width: 34em;
  overflow-wrap: anywhere;
}
.meta { grid-column: 2; color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta a { color: var(--muted); }
.meta a:hover { color: var(--ink); }
.lic-check { color: var(--drop); }
.tags { display: inline-flex; gap: 6px; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.decide { grid-column: 2; display: flex; gap: 8px; margin-top: 10px; }
.decide button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 4px 14px; cursor: pointer; color: var(--muted); }
.decide .k[aria-pressed="true"] { border-color: var(--keep); color: var(--keep); }
.decide .d[aria-pressed="true"] { border-color: var(--drop); color: var(--drop); }
.empty { color: var(--muted); padding: 40px 0; }
.top { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
a.btn { color: var(--muted); text-decoration: none; }
.btn.go { border-color: var(--glow); color: var(--glow); }
.decide .more { margin-left: auto; }
.extra-badge { color: var(--glow); }
.overlay { position: fixed; inset: 0; z-index: 5; display: none; background: rgba(20,22,27,.6); }
.overlay.open { display: block; }
.sheet {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(640px, 100%);
  background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.sheet-head .row { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet-head h2 { margin: 0; font: 500 1rem/1.3 var(--sans); }
.sheet-head audio { width: 100%; margin-top: 12px; }
.hint { color: var(--muted); font-size: .82rem; margin-top: 6px; }
#lines { flex: 1; overflow-y: auto; padding: 6px 0; }
.line { display: grid; grid-template-columns: 26px 52px 1fr; gap: 8px; align-items: start; padding: 7px 18px; cursor: pointer; }
.line:hover { background: var(--surface); }
.line input { margin-top: 4px; accent-color: var(--glow); }
.line time { color: var(--muted); font-size: .8rem; padding-top: 2px; font-variant-numeric: tabular-nums; }
.line .tx { font: italic 400 1.02rem/1.4 var(--serif); }
.line.inclip { border-left: 3px solid var(--glow); padding-left: 15px; }
.line.sel .tx { color: var(--glow); }
.line.now { background: var(--surface); }
.sheet-foot { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#selinfo { color: var(--muted); font-size: .85rem; margin-right: auto; }
.form { padding: 16px 18px; overflow-y: auto; flex: 1; display: grid; gap: 14px; align-content: start; }
.form label { display: grid; gap: 5px; font-size: .85rem; color: var(--muted); }
.form label.check { display: flex; gap: 8px; align-items: center; }
.form textarea, .form input[type=number], .form select {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px; font: inherit; width: 100%;
}
.form textarea { min-height: 84px; resize: vertical; }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#runstatus { color: var(--glow); }
#runstatus:empty { display: none; }
#runstatus a { color: inherit; }
.btn:disabled, .btn[disabled] { opacity: .45; cursor: default; }
.keys { color: var(--muted); font-size: .8rem; margin-top: 28px; }
kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
@media (max-width: 560px) {
  .actions { margin-left: 0; width: 100%; }
  .actions .btn { flex: 1; }
  .quote { font-size: 1.2rem; }
  .keys { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <h1><select id="batch" aria-label="Batch" hidden></select><span id="nobatch">VK miner</span></h1>
      <button class="btn go" id="newrun">Nieuwe batch</button>
    </div>
    <div class="sub" id="sub">Laden…</div>
    <div class="sub" id="runstatus" aria-live="polite"></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Filter">
        <button data-f="todo" aria-pressed="true">Te beoordelen</button>
        <button data-f="keep" aria-pressed="false">Bewaard</button>
        <button data-f="drop" aria-pressed="false">Weg</button>
        <button data-f="all" aria-pressed="false">Alles</button>
      </div>
      <select id="sort" aria-label="Sorteren">
        <option value="score">Op score</option>
        <option value="source">Op bron</option>
      </select>
      <div class="actions">
        <button class="btn" id="zip" disabled>Download bewaard (.zip)</button>
        <button class="btn" id="json" disabled>Lijst (.json)</button>
      </div>
    </div>
  </div>
</header>
<main>
  <div id="list"></div>
  <p class="keys"><kbd>spatie</kbd> afspelen <kbd>↑</kbd><kbd>↓</kbd> vorige/volgende <kbd>b</kbd> bewaren <kbd>w</kbd> weg <kbd>r</kbd> herhalen aan/uit</p>
</main>

<div id="runpanel" class="overlay" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rtitle">
    <div class="sheet-head">
      <div class="row">
        <h2 id="rtitle">Nieuwe batch</h2>
        <button class="btn" id="rclose">Sluiten</button>
      </div>
      <p class="hint">Zoekt op heel Internet Archive, inclusief Prelinger. Lege velden gebruiken de standaardlijsten.</p>
    </div>
    <div class="form">
      <label>Zoekwoorden: wat moet hij vinden? Eén per regel of met komma's.
        <textarea id="r-terms" placeholder="zombie&#10;mad scientist&#10;voodoo"></textarea>
      </label>
      <label>Trefwoorden: welke zinnen moet hij knippen? Komen bovenop de standaardlijst.
        <textarea id="r-kw" placeholder="they came&#10;the experiment&#10;don't go in there"></textarea>
      </label>
      <div class="row2">
        <label>Aantal items <input id="r-items" type="number" min="1" max="20" value="5"></label>
        <label>Kwaliteit transcriptie
          <select id="r-model">
            <option value="base.en">Snel</option>
            <option value="small.en">Beter (3x trager)</option>
          </select>
        </label>
      </div>
      <label class="check"><input id="r-pd" type="checkbox" checked> Alleen materiaal met duidelijke vrije licentie</label>
      <label id="r-passwrap" hidden>Wachtwoord <input id="r-pass" type="password" autocomplete="current-password" style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit"></label>
    </div>
    <div class="sheet-foot">
      <span class="hint" id="rmsg" style="margin:0 auto 0 0">Duurt meestal 15–30 minuten.</span>
      <button class="btn go" id="rstart">Start batch</button>
    </div>
  </div>
</div>

<div id="panel" class="overlay" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <div class="sheet-head">
      <div class="row">
        <h2 id="ptitle"></h2>
        <button class="btn" id="pclose">Sluiten</button>
      </div>
      <audio id="srcAudio" controls preload="none"></audio>
      <p class="hint" id="phint"></p>
    </div>
    <div id="lines"></div>
    <div class="sheet-foot">
      <span id="selinfo">Niets geselecteerd</span>
      <button class="btn" id="pclear">Selectie wissen</button>
      <button class="btn go" id="preq" disabled>Knip selectie</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const PLAY = '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
const PAUSE = '<svg viewBox="0 0 10 10"><path d="M2 1h2v8H2zM6 1h2v8H6z"/></svg>';
let base = '', data = { batch: {}, clips: [] }, decisions = {}, filter = 'todo', sort = 'score', cur = 0, loop = false;
const audio = new Audio();
let playingId = null;
const $ = s => document.querySelector(s);
const storeKey = () => 'vkminer:' + (data.batch.name || 'batch');

function load() {
  try { decisions = JSON.parse(localStorage.getItem(storeKey())) || {}; } catch { decisions = {}; }
}
function save() {
  try { localStorage.setItem(storeKey(), JSON.stringify(decisions)); } catch {}
}
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function visible() {
  let list = data.clips.filter(c => {
    const st = decisions[c.id];
    return filter === 'all' || (filter === 'todo' ? !st : st === filter);
  });
  if (sort === 'source') list = [...list].sort((a, b) => (a.item + a.source_file).localeCompare(b.item + b.source_file) || a.start - b.start);
  return list;
}

function render() {
  const list = visible();
  const kept = data.clips.filter(c => decisions[c.id] === 'keep').length;
  const done = Object.keys(decisions).length;
  $('#sub').textContent = `${data.clips.length} clips, ${done} beoordeeld, ${kept} bewaard` +
    (data.batch.claude ? '' : ' (zonder Claude-score)');
  $('#zip').disabled = $('#json').disabled = kept === 0;
  cur = Math.min(cur, Math.max(0, list.length - 1));
  if (!list.length) {
    $('#list').innerHTML = `<p class="empty">${data.clips.length ? 'Niets in deze weergave. Kies een ander filter.' : 'Deze batch heeft geen clips opgeleverd. Probeer een andere preset of verlaag de drempel in config.yaml.'}</p>`;
    return;
  }
  $('#list').innerHTML = list.map((c, i) => {
    const st = decisions[c.id] || '';
    const lic = c.license?.status === 'check'
      ? `<span class="lic-check" title="${esc(c.license.rights)}">Licentie controleren</span>`
      : `<span title="${esc(c.license?.url || '')}">${c.license?.status === 'cc' ? 'Creative Commons' : 'Publiek domein'}</span>`;
    return `<article class="clip${i === cur ? ' current' : ''}${playingId === c.id ? ' playing' : ''}" data-id="${c.id}" data-i="${i}" data-state="${st}">
      <button class="play" aria-label="Afspelen">${playingId === c.id && !audio.paused ? PAUSE : PLAY}</button>
      <div><p class="quote">“${esc(c.text)}”</p></div>
      <div class="meta">
        <a href="${esc(c.item_url)}" target="_blank" rel="noopener">${esc(c.title)}${c.year ? ' (' + esc(c.year.slice(0, 4)) + ')' : ''}</a>
        <a href="${esc(c.source_url)}" target="_blank" rel="noopener">bron op ${fmt(c.start)}</a>
        <span>${(c.end - c.start).toFixed(1)} s</span>
        ${c.extra ? '<span class="extra-badge">extra</span>' : `<span>score ${c.score}</span>`}
        ${lic}
        ${c.tags?.length ? `<span class="tags">${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</span>` : ''}
      </div>
      <div class="decide">
        <button class="k" aria-pressed="${st === 'keep'}">Bewaren</button>
        <button class="d" aria-pressed="${st === 'drop'}">Weg</button>
        <a class="btn" href="${esc(base + c.file)}" download style="text-decoration:none;font-size:.85rem;padding:4px 10px">WAV</a>
        <button class="more lng">Langer</button>
        <button class="mre">Meer uit bron</button>
      </div>
    </article>`;
  }).join('');
}

function toggle(c) {
  if (playingId === c.id && !audio.paused) { audio.pause(); render(); return; }
  if (playingId !== c.id) { audio.src = base + c.file; playingId = c.id; }
  audio.currentTime = 0; audio.loop = loop;
  audio.play().catch(() => {}); render();
}
audio.addEventListener('ended', render);
audio.addEventListener('pause', () => setTimeout(render, 0));

function decide(c, st) {
  decisions[c.id] === st ? delete decisions[c.id] : (decisions[c.id] = st);
  save();
  const stillVisible = visible().some(v => v.id === c.id);
  if (stillVisible) cur++;
  render(); scrollCur();
  const next = visible()[cur];
  if (next && playingId) toggle(next);
}
function scrollCur() { document.querySelector('.clip.current')?.scrollIntoView({ block: 'nearest' }); }

$('#list').addEventListener('click', e => {
  const art = e.target.closest('.clip'); if (!art) return;
  const c = data.clips.find(x => x.id === art.dataset.id);
  cur = +art.dataset.i;
  if (e.target.closest('.play')) toggle(c);
  else if (e.target.closest('.k')) decide(c, 'keep');
  else if (e.target.closest('.d')) decide(c, 'drop');
  else if (e.target.closest('.lng')) openPanel(c, true);
  else if (e.target.closest('.mre')) openPanel(c, false);
  else if (!e.target.closest('a')) render();
});
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f; cur = 0;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
$('#sort').addEventListener('change', e => { sort = e.target.value; cur = 0; render(); });

document.addEventListener('keydown', e => {
  if ($('#panel').classList.contains('open')) { if (e.key === 'Escape') closePanel(); return; }
  if ($('#runpanel').classList.contains('open')) { if (e.key === 'Escape') closeRun(); return; }
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey) return;
  if (e.key === ' ' && e.target.closest('button, a')) return;
  const list = visible(); const c = list[cur]; if (!c) return;
  if (e.key === ' ') { e.preventDefault(); toggle(c); }
  else if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); cur = Math.min(cur + 1, list.length - 1); render(); scrollCur(); if (playingId) toggle(list[cur]); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); cur = Math.max(cur - 1, 0); render(); scrollCur(); if (playingId) toggle(list[cur]); }
  else if (e.key === 'b') decide(c, 'keep');
  else if (e.key === 'w') decide(c, 'drop');
  else if (e.key === 'r') { loop = !loop; audio.loop = loop; }
});

// ---- Bronpaneel: langer luisteren en extra stukken kiezen ----
const srcAudio = $('#srcAudio');
let pClip = null, pSegs = [], pSel = new Set(), pUrl = '';

function playFrom(t) {
  audio.pause();
  const go = () => { srcAudio.currentTime = t; srcAudio.play().catch(() => {}); };
  if (srcAudio.readyState >= 1) go();
  else { srcAudio.preload = 'auto'; srcAudio.addEventListener('loadedmetadata', go, { once: true }); srcAudio.load(); }
}

async function openPanel(c, longer) {
  pClip = c; pSel = new Set(); pSegs = [];
  pUrl = c.source_dl || (c.source_url || '').split('#')[0];
  $('#ptitle').textContent = c.title + (c.source_file ? ` (${c.source_file})` : '');
  srcAudio.pause(); srcAudio.src = pUrl; srcAudio.preload = 'none';
  $('#panel').classList.add('open'); $('#panel').setAttribute('aria-hidden', 'false');
  $('#lines').innerHTML = '';
  if (c.transcript) {
    try {
      const t = await fetch(base + c.transcript).then(r => r.json());
      pSegs = t.segments || [];
      if (t.url) { pUrl = t.url; srcAudio.src = pUrl; }
    } catch { pSegs = []; }
  }
  const t0 = c.t0 ?? c.start, t1 = c.t1 ?? c.end;
  const inClip = s => s[0] < t1 && s[1] > t0;
  if (!pSegs.length) {
    $('#phint').textContent = 'Geen tekst beschikbaar voor deze batch. Je kunt wel de hele bron beluisteren; nieuwe batches hebben ook de tekst.';
    $('#lines').innerHTML = '';
    updateSel(); playFrom(c.start); return;
  }
  $('#phint').textContent = 'Klik een zin om vanaf daar te luisteren. Vink zinnen aan om ze te laten knippen; aaneengesloten zinnen worden één clip.';
  if (longer) {
    const idx = pSegs.map((s, i) => inClip(s) ? i : -1).filter(i => i >= 0);
    const last = idx.length ? idx[idx.length - 1] : 0;
    for (let i = idx[0] ?? 0; i <= Math.min(pSegs.length - 1, last + 3); i++) pSel.add(i);
  }
  $('#lines').innerHTML = pSegs.map((s, i) => `<div class="line${inClip(s) ? ' inclip' : ''}${pSel.has(i) ? ' sel' : ''}" data-i="${i}">
      <input type="checkbox" aria-label="Selecteer" ${pSel.has(i) ? 'checked' : ''}>
      <time>${fmt(s[0])}</time><span class="tx">${esc(s[2])}</span></div>`).join('');
  updateSel();
  const first = $('#lines .inclip');
  first?.scrollIntoView({ block: 'center' });
  playFrom(Math.max(0, t0 - 0.3));
}

function closePanel() {
  srcAudio.pause();
  $('#panel').classList.remove('open'); $('#panel').setAttribute('aria-hidden', 'true');
}

function selRanges() {
  const idx = [...pSel].sort((a, b) => a - b), out = [];
  for (const i of idx) {
    const s = pSegs[i], last = out[out.length - 1];
    if (last && last.i === i - 1) { last.end = s[1]; last.text += ' ' + s[2]; last.i = i; }
    else out.push({ start: s[0], end: s[1], text: s[2], i });
  }
  return out.map(({ start, end, text }) => ({ start, end, text }));
}

function updateSel() {
  const rs = selRanges();
  const secs = rs.reduce((n, r) => n + r.end - r.start, 0);
  $('#selinfo').textContent = rs.length ? `${rs.length} clip(s), ${secs.toFixed(1)} s` : 'Niets geselecteerd';
  $('#preq').disabled = !rs.length || !pClip?.transcript;
}

$('#lines').addEventListener('click', e => {
  const row = e.target.closest('.line'); if (!row) return;
  const i = +row.dataset.i;
  if (e.target.matches('input')) {
    e.target.checked ? pSel.add(i) : pSel.delete(i);
    row.classList.toggle('sel', e.target.checked); updateSel();
  } else playFrom(pSegs[i][0]);
});
srcAudio.addEventListener('timeupdate', () => {
  const t = srcAudio.currentTime;
  const i = pSegs.findIndex(s => t >= s[0] && t < s[1] + 0.2);
  document.querySelectorAll('#lines .now').forEach(n => n.classList.remove('now'));
  if (i >= 0) document.querySelector(`#lines .line[data-i="${i}"]`)?.classList.add('now');
});
$('#pclose').addEventListener('click', closePanel);
$('#panel').addEventListener('click', e => { if (e.target.id === 'panel') closePanel(); });
$('#pclear').addEventListener('click', () => {
  pSel.clear(); document.querySelectorAll('#lines input').forEach(x => x.checked = false);
  document.querySelectorAll('#lines .sel').forEach(x => x.classList.remove('sel')); updateSel();
});
$('#preq').addEventListener('click', async () => {
  const rs = selRanges(); if (!rs.length) return;
  $('#preq').disabled = true; $('#selinfo').textContent = 'Versturen…';
  const res = await api({ kind: 'cuts', request: { batch: data.batch.name, transcript: pClip.transcript, ranges: rs } });
  if (res.error) { $('#selinfo').textContent = res.error; $('#preq').disabled = false; return; }
  $('#selinfo').textContent = 'Wordt geknipt. Over een paar minuten staan de clips bovenaan, met label extra.';
  watchCuts(data.batch.name, data.clips.length);
});

function keptList() { return data.clips.filter(c => decisions[c.id] === 'keep'); }
function saveBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#json').addEventListener('click', () => {
  saveBlob(new Blob([JSON.stringify({ batch: data.batch, clips: keptList() }, null, 1)], { type: 'application/json' }), `${data.batch.name || 'batch'}-bewaard.json`);
});
$('#zip').addEventListener('click', async () => {
  const btn = $('#zip'); const kept = keptList();
  if (!window.JSZip) { btn.textContent = 'Zip niet beschikbaar'; return; }
  btn.disabled = true;
  const zip = new JSZip();
  for (let i = 0; i < kept.length; i++) {
    btn.textContent = `Inpakken ${i + 1}/${kept.length}`;
    const r = await fetch(base + kept[i].file); zip.file(kept[i].file.split('/').pop(), await r.blob());
  }
  zip.file('bronnen.json', JSON.stringify(kept, null, 1));
  saveBlob(await zip.generateAsync({ type: 'blob' }), `${data.batch.name || 'batch'}-bewaard.zip`);
  btn.textContent = 'Download bewaard (.zip)'; btn.disabled = false;
});

function loadBatch(name) {
  base = `batches/${name}/`; cur = 0; audio.pause(); playingId = null;
  history.replaceState(null, '', '#' + name);
  fetch(base + 'clips.json').then(r => r.json()).then(d => { data = d; load(); render(); })
    .catch(() => { data = { batch: {}, clips: [] }; $('#sub').textContent = `Batch ${name} kon niet geladen worden.`; $('#list').innerHTML = ''; });
}
$('#batch').addEventListener('change', e => loadBatch(e.target.value));
let batchNames = [];
async function refreshBatches(pick) {
  const list = await fetch('batches.json?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []);
  batchNames = list.map(b => b.name);
  if (!list.length) {
    $('#sub').textContent = 'Nog geen batches. Klik op Nieuwe batch.';
    return list;
  }
  $('#batch').hidden = false; $('#nobatch').hidden = true;
  $('#batch').innerHTML = list.map(b => `<option value="${esc(b.name)}">${esc(b.name)}${b.preset ? ': ' + esc(b.preset) : ''} (${b.count})</option>`).join('');
  const want = pick || decodeURIComponent(location.hash.slice(1));
  const name = batchNames.includes(want) ? want : list[0].name;
  $('#batch').value = name; loadBatch(name);
  return list;
}
const firstLoad = refreshBatches();


// ---- Starten via de Netlify-functie ----
const API = 'api/run';
let needsPassword = false, watchTimer = null;
const list = v => v.split(/[\n,]/).map(x => x.trim()).filter(Boolean);
const mins = iso => Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
try { $('#r-pass').value = localStorage.getItem('vkminer:pw') || ''; } catch {}

async function api(body) {
  if (body) {
    let pw = $('#r-pass').value;
    if (needsPassword && !pw) { pw = prompt('Wachtwoord') || ''; $('#r-pass').value = pw; }
    body.password = pw;
  }
  try {
    const r = await fetch(API, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
    const d = await r.json().catch(() => ({ error: `Startknop niet bereikbaar (${r.status}).` }));
    if (body && r.ok) { try { localStorage.setItem('vkminer:pw', body.password || ''); } catch {} }
    return r.ok ? d : { ...d, error: d.error || `Fout ${r.status}` };
  } catch { return { error: 'Startknop niet bereikbaar.' }; }
}

function showRun(run) {
  if (run && run.status !== 'completed') {
    $('#runstatus').innerHTML = `Batch bezig, ${mins(run.started)} min (<a href="${esc(run.url)}" target="_blank" rel="noopener">details</a>)`;
    $('#rstart').disabled = true; $('#newrun').textContent = 'Batch bezig…';
    return 'busy';
  }
  $('#rstart').disabled = false; $('#newrun').textContent = 'Nieuwe batch';
  if (run && run.conclusion && run.conclusion !== 'success' && mins(run.updated) < 120) {
    $('#runstatus').innerHTML = `Laatste batch mislukt (<a href="${esc(run.url)}" target="_blank" rel="noopener">details</a>)`;
  } else $('#runstatus').textContent = '';
  return 'idle';
}

async function watchRun(before, since = 0) {
  clearTimeout(watchTimer);
  const d = await api();
  const notPickedUp = since && (!d.run || new Date(d.run.started).getTime() < since - 60000) && Date.now() - since < 300000;
  const st = d.error || notPickedUp ? 'busy' : showRun(d.run);
  if (st === 'busy') { watchTimer = setTimeout(() => watchRun(before, since), 20000); return; }
  // run klaar: wachten tot Netlify de batch online heeft
  const fresh = (await refreshBatches()).find(b => !before.includes(b.name));
  if (fresh) { refreshBatches(fresh.name); $('#runstatus').textContent = `Nieuwe batch: ${fresh.count} clips.`; return; }
  if (d.run && d.run.conclusion === 'success' && mins(d.run.updated) < 15) {
    $('#runstatus').textContent = 'Batch klaar, wordt gepubliceerd…';
    watchTimer = setTimeout(() => watchRun(before, since), 20000);
  }
}

function watchCuts(batch, count, tries = 0) {
  setTimeout(async () => {
    const d = await fetch(`batches/${batch}/clips.json?` + Date.now(), { cache: 'no-store' }).then(r => r.json()).catch(() => null);
    if (d && d.clips.length > count) {
      if (data.batch.name === batch) { data = d; render(); }
      $('#runstatus').textContent = `${d.clips.length - count} extra clip(s) toegevoegd.`;
      refreshBatches(data.batch.name);
    } else if (tries < 30) watchCuts(batch, count, tries + 1);
  }, 20000);
}

function closeRun() { $('#runpanel').classList.remove('open'); $('#runpanel').setAttribute('aria-hidden', 'true'); }
$('#newrun').addEventListener('click', () => {
  $('#runpanel').classList.add('open'); $('#runpanel').setAttribute('aria-hidden', 'false'); $('#r-terms').focus();
});
$('#rclose').addEventListener('click', closeRun);
$('#runpanel').addEventListener('click', e => { if (e.target.id === 'runpanel') closeRun(); });

$('#rstart').addEventListener('click', async () => {
  const request = {
    terms: list($('#r-terms').value), keywords: list($('#r-kw').value),
    max_items: Math.max(1, Math.min(20, +$('#r-items').value || 5)),
    whisper: $('#r-model').value, pd_only: $('#r-pd').checked,
  };
  $('#rstart').disabled = true; $('#rmsg').textContent = 'Starten…';
  const res = await api({ kind: 'run', request });
  if (res.error) { $('#rmsg').textContent = res.error; $('#rstart').disabled = false; return; }
  $('#rmsg').textContent = 'Duurt meestal 15–30 minuten.';
  closeRun();
  $('#runstatus').textContent = 'Batch gestart. Deze pagina mag open blijven; de nieuwe batch verschijnt vanzelf.';
  const before = [...batchNames];
  const since = Date.now();
  setTimeout(() => watchRun(before, since), 15000);
});

firstLoad.then(() => api()).then(d => {
  needsPassword = !!d.needsPassword; $('#r-passwrap').hidden = !needsPassword;
  if (!d.error && showRun(d.run) === 'busy') watchRun([...batchNames]);
});
</script>
</body>
