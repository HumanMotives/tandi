<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VK miner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #23262e; --surface: #2c3039; --line: #3b404b;
  --ink: #ebe6dc; --muted: #9a9fa9;
  --glow: #b7a4e3; --keep: #8fbfa6; --drop: #cf8a80;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 140px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar { max-width: 760px; margin: 0 auto; padding: 14px 18px 12px; }
h1 { margin: 0; font: 500 1.05rem/1.3 var(--sans); }
h1 select { font-weight: 500; max-width: 100%; }
.sub { color: var(--muted); font-size: .85rem; margin-top: 2px; overflow-wrap: anywhere; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.actions { display: flex; gap: 8px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: default; }

main { max-width: 760px; margin: 0 auto; padding: 6px 18px 60px; }
.clip {
  display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px;
  padding: 18px 0 16px 12px; border-bottom: 1px solid var(--line);
  border-left: 3px solid transparent; margin-left: -15px;
}
.clip.current { border-left-color: var(--glow); }
.clip[data-state="keep"] .quote { color: var(--keep); }
.clip[data-state="drop"] { opacity: .45; }
.play {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; display: grid; place-items: center;
}
.play svg { width: 14px; height: 14px; fill: var(--ink); }
.clip.playing .play { border-color: var(--glow); box-shadow: 0 0 0 4px rgba(183,164,227,.18); }
.quote {
  font: italic 400 1.38rem/1.35 var(--serif); margin: 4px 0 8px; max-width: 34em;
  overflow-wrap: anywhere;
}
.meta { grid-column: 2; color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta a { color: var(--muted); }
.meta a:hover { color: var(--ink); }
.lic-check { color: var(--drop); }
.tags { display: inline-flex; gap: 6px; }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.decide { grid-column: 2; display: flex; gap: 8px; margin-top: 10px; }
.decide button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 4px 14px; cursor: pointer; color: var(--muted); }
.decide .k[aria-pressed="true"] { border-color: var(--keep); color: var(--keep); }
.decide .d[aria-pressed="true"] { border-color: var(--drop); color: var(--drop); }
.empty { color: var(--muted); padding: 40px 0; }
.top { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
a.btn { color: var(--muted); }
.btn.go { border-color: var(--glow); color: var(--glow); }
#run { display: none; margin-top: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
#run.open { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
.grid label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
.grid label.wide { grid-column: 1 / -1; }
.grid label.check { flex-direction: row; align-items: center; gap: 8px; }
.grid input[type=text], .grid input[type=number], .grid input[type=password], .grid select {
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; width: 100%;
}
.runrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
#runstate { font-size: .85rem; color: var(--muted); }
#runstate a { color: var(--glow); }
.keys { color: var(--muted); font-size: .8rem; margin-top: 28px; }
kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
@media (max-width: 560px) {
  .actions { margin-left: 0; width: 100%; }
  .actions .btn { flex: 1; }
  .quote { font-size: 1.2rem; }
  .keys { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <h1><select id="batch" aria-label="Batch" hidden></select><span id="nobatch">VK miner</span></h1>
      <button class="btn go" id="newrun" aria-expanded="false" aria-controls="run">Nieuwe batch</button>
    </div>
    <div class="sub" id="sub">Laden…</div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Filter">
        <button data-f="todo" aria-pressed="true">Te beoordelen</button>
        <button data-f="keep" aria-pressed="false">Bewaard</button>
        <button data-f="drop" aria-pressed="false">Weg</button>
        <button data-f="all" aria-pressed="false">Alles</button>
      </div>
      <select id="sort" aria-label="Sorteren">
        <option value="score">Op score</option>
        <option value="source">Op bron</option>
      </select>
      <div class="actions">
        <button class="btn" id="zip" disabled>Download bewaard (.zip)</button>
        <button class="btn" id="json" disabled>Lijst (.json)</button>
      </div>
    </div>
    <section id="run" aria-label="Nieuwe batch starten">
      <div class="grid">
        <label>Zoekset
          <select id="f-preset">
            <option value="otr-scifi">Old-time radio sci-fi</option>
            <option value="ufo-interviews">UFO-interviews</option>
            <option value="bmovies">Horror- en sci-fi-films</option>
            <option value="prelinger">Prelinger-films</option>
            <option value="custom">Eigen zoekopdracht</option>
          </select>
        </label>
        <label>Items <input id="f-items" type="number" min="1" max="20" value="5"></label>
        <label>Bestanden per item <input id="f-files" type="number" min="1" max="10" value="3"></label>
        <label>Kwaliteit transcriptie
          <select id="f-model">
            <option value="base.en">Snel</option>
            <option value="small.en">Beter (3x trager)</option>
            <option value="medium.en">Best (erg traag)</option>
          </select>
        </label>
        <label class="wide">Extra zoektermen (optioneel) <input id="f-query" type="text" placeholder="bijv. hypnosis OR telepathy"></label>
        <label class="check wide"><input id="f-pd" type="checkbox" checked> Alleen materiaal met duidelijke vrije licentie</label>
      </div>
      <div class="runrow">
        <button class="btn go" id="start">Start batch</button>
        <span id="runstate"></span>
      </div>
    </section>
  </div>
</header>
<main>
  <div id="list"></div>
  <p class="keys"><kbd>spatie</kbd> afspelen <kbd>↑</kbd><kbd>↓</kbd> vorige/volgende <kbd>b</kbd> bewaren <kbd>w</kbd> weg <kbd>r</kbd> herhalen aan/uit</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const PLAY = '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
const PAUSE = '<svg viewBox="0 0 10 10"><path d="M2 1h2v8H2zM6 1h2v8H6z"/></svg>';
let base = '', data = { batch: {}, clips: [] }, decisions = {}, filter = 'todo', sort = 'score', cur = 0, loop = false;
const audio = new Audio();
let playingId = null;
const $ = s => document.querySelector(s);
const storeKey = () => 'vkminer:' + (data.batch.name || 'batch');

function load() {
  try { decisions = JSON.parse(localStorage.getItem(storeKey())) || {}; } catch { decisions = {}; }
}
function save() {
  try { localStorage.setItem(storeKey(), JSON.stringify(decisions)); } catch {}
}
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function visible() {
  let list = data.clips.filter(c => {
    const st = decisions[c.id];
    return filter === 'all' || (filter === 'todo' ? !st : st === filter);
  });
  if (sort === 'source') list = [...list].sort((a, b) => (a.item + a.source_file).localeCompare(b.item + b.source_file) || a.start - b.start);
  return list;
}

function render() {
  const list = visible();
  const kept = data.clips.filter(c => decisions[c.id] === 'keep').length;
  const done = Object.keys(decisions).length;
  $('#sub').textContent = `${data.clips.length} clips, ${done} beoordeeld, ${kept} bewaard` +
    (data.batch.claude ? '' : ' (zonder Claude-score)');
  $('#zip').disabled = $('#json').disabled = kept === 0;
  cur = Math.min(cur, Math.max(0, list.length - 1));
  if (!list.length) {
    $('#list').innerHTML = `<p class="empty">${data.clips.length ? 'Niets in deze weergave. Kies een ander filter.' : 'Deze batch heeft geen clips opgeleverd. Probeer een andere preset of verlaag de drempel in config.yaml.'}</p>`;
    return;
  }
  $('#list').innerHTML = list.map((c, i) => {
    const st = decisions[c.id] || '';
    const lic = c.license?.status === 'check'
      ? `<span class="lic-check" title="${esc(c.license.rights)}">Licentie controleren</span>`
      : `<span title="${esc(c.license?.url || '')}">${c.license?.status === 'cc' ? 'Creative Commons' : 'Publiek domein'}</span>`;
    return `<article class="clip${i === cur ? ' current' : ''}${playingId === c.id ? ' playing' : ''}" data-id="${c.id}" data-i="${i}" data-state="${st}">
      <button class="play" aria-label="Afspelen">${playingId === c.id && !audio.paused ? PAUSE : PLAY}</button>
      <div><p class="quote">“${esc(c.text)}”</p></div>
      <div class="meta">
        <a href="${esc(c.item_url)}" target="_blank" rel="noopener">${esc(c.title)}${c.year ? ' (' + esc(c.year.slice(0, 4)) + ')' : ''}</a>
        <a href="${esc(c.source_url)}" target="_blank" rel="noopener">bron op ${fmt(c.start)}</a>
        <span>${(c.end - c.start).toFixed(1)} s</span>
        <span>score ${c.score}</span>
        ${lic}
        ${c.tags?.length ? `<span class="tags">${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</span>` : ''}
      </div>
      <div class="decide">
        <button class="k" aria-pressed="${st === 'keep'}">Bewaren</button>
        <button class="d" aria-pressed="${st === 'drop'}">Weg</button>
        <a class="btn" href="${esc(base + c.file)}" download style="text-decoration:none;font-size:.85rem;padding:4px 10px">WAV</a>
      </div>
    </article>`;
  }).join('');
}

function toggle(c) {
  if (playingId === c.id && !audio.paused) { audio.pause(); render(); return; }
  if (playingId !== c.id) { audio.src = base + c.file; playingId = c.id; }
  audio.currentTime = 0; audio.loop = loop;
  audio.play().catch(() => {}); render();
}
audio.addEventListener('ended', render);
audio.addEventListener('pause', () => setTimeout(render, 0));

function decide(c, st) {
  decisions[c.id] === st ? delete decisions[c.id] : (decisions[c.id] = st);
  save();
  const stillVisible = visible().some(v => v.id === c.id);
  if (stillVisible) cur++;
  render(); scrollCur();
  const next = visible()[cur];
  if (next && playingId) toggle(next);
}
function scrollCur() { document.querySelector('.clip.current')?.scrollIntoView({ block: 'nearest' }); }

$('#list').addEventListener('click', e => {
  const art = e.target.closest('.clip'); if (!art) return;
  const c = data.clips.find(x => x.id === art.dataset.id);
  cur = +art.dataset.i;
  if (e.target.closest('.play')) toggle(c);
  else if (e.target.closest('.k')) decide(c, 'keep');
  else if (e.target.closest('.d')) decide(c, 'drop');
  else if (!e.target.closest('a')) render();
});
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f; cur = 0;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
$('#sort').addEventListener('change', e => { sort = e.target.value; cur = 0; render(); });

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey) return;
  if (e.key === ' ' && e.target.closest('button, a')) return;
  const list = visible(); const c = list[cur]; if (!c) return;
  if (e.key === ' ') { e.preventDefault(); toggle(c); }
  else if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); cur = Math.min(cur + 1, list.length - 1); render(); scrollCur(); if (playingId) toggle(list[cur]); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); cur = Math.max(cur - 1, 0); render(); scrollCur(); if (playingId) toggle(list[cur]); }
  else if (e.key === 'b') decide(c, 'keep');
  else if (e.key === 'w') decide(c, 'drop');
  else if (e.key === 'r') { loop = !loop; audio.loop = loop; }
});

function keptList() { return data.clips.filter(c => decisions[c.id] === 'keep'); }
function saveBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#json').addEventListener('click', () => {
  saveBlob(new Blob([JSON.stringify({ batch: data.batch, clips: keptList() }, null, 1)], { type: 'application/json' }), `${data.batch.name || 'batch'}-bewaard.json`);
});
$('#zip').addEventListener('click', async () => {
  const btn = $('#zip'); const kept = keptList();
  if (!window.JSZip) { btn.textContent = 'Zip niet beschikbaar'; return; }
  btn.disabled = true;
  const zip = new JSZip();
  for (let i = 0; i < kept.length; i++) {
    btn.textContent = `Inpakken ${i + 1}/${kept.length}`;
    const r = await fetch(base + kept[i].file); zip.file(kept[i].file.split('/').pop(), await r.blob());
  }
  zip.file('bronnen.json', JSON.stringify(kept, null, 1));
  saveBlob(await zip.generateAsync({ type: 'blob' }), `${data.batch.name || 'batch'}-bewaard.zip`);
  btn.textContent = 'Download bewaard (.zip)'; btn.disabled = false;
});

function loadBatch(name) {
  base = `batches/${name}/`; cur = 0; audio.pause(); playingId = null;
  history.replaceState(null, '', '#' + name);
  fetch(base + 'clips.json').then(r => r.json()).then(d => { data = d; load(); render(); })
    .catch(() => { data = { batch: {}, clips: [] }; $('#sub').textContent = `Batch ${name} kon niet geladen worden.`; $('#list').innerHTML = ''; });
}
$('#batch').addEventListener('change', e => loadBatch(e.target.value));
let batchNames = [];
async function refreshBatches(pick) {
  const list = await fetch('batches.json?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []);
  batchNames = list.map(b => b.name);
  if (!list.length) {
    $('#sub').textContent = 'Nog geen batches. Start er een met Nieuwe batch.';
    return list;
  }
  $('#batch').hidden = false; $('#nobatch').hidden = true;
  $('#batch').innerHTML = list.map(b => `<option value="${esc(b.name)}">${esc(b.name)} (${b.count})</option>`).join('');
  const want = pick || decodeURIComponent(location.hash.slice(1));
  const name = batchNames.includes(want) ? want : list[0].name;
  $('#batch').value = name; loadBatch(name);
  return list;
}
const firstLoad = refreshBatches();

// ---- Nieuwe batch starten ----
const API = 'api/run';
let pollTimer = null, knownBefore = null;
$('#newrun').addEventListener('click', () => {
  const open = $('#run').classList.toggle('open');
  $('#newrun').setAttribute('aria-expanded', open);
});
const mins = iso => Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
function setState(html) { $('#runstate').innerHTML = html; }

async function checkRun(showIdle) {
  let d;
  try { d = await fetch(API, { cache: 'no-store' }).then(r => r.json()); } catch { d = { error: 'offline' }; }
  if (d.error) {
    if (showIdle) setState(d.error === 'not-configured' ? 'Startknop nog niet ingesteld in Netlify (zie LEESMIJ).' : 'Status niet beschikbaar.');
    return null;
  }
  const run = d.run;
  if (!run) { if (showIdle) setState(''); return null; }
  const log = `<a href="${esc(run.url)}" target="_blank" rel="noopener">log</a>`;
  if (run.status !== 'completed') {
    setState(`${run.status === 'queued' ? 'In de wachtrij' : 'Bezig'}, ${mins(run.started)} min (${log})`);
    $('#start').disabled = true; $('#newrun').textContent = 'Batch bezig…';
    return 'busy';
  }
  $('#start').disabled = false; $('#newrun').textContent = 'Nieuwe batch';
  if (run.conclusion === 'success') {
    if (showIdle) setState(`Laatste run klaar, ${mins(run.updated)} min geleden.`);
    return 'done';
  }
  if (showIdle || pollTimer) setState(`Laatste run mislukt (${log}).`);
  return 'failed';
}

async function poll() {
  clearTimeout(pollTimer);
  const st = await checkRun(false);
  if (st === 'busy' || st === null) { pollTimer = setTimeout(poll, 20000); return; }
  if (st === 'failed') { pollTimer = null; return; }
  // klaar: wachten tot Netlify de nieuwe batch online heeft
  const list = await refreshBatches();
  const fresh = list.find(b => !knownBefore || !knownBefore.includes(b.name));
  if (fresh) {
    setState(`Klaar: ${fresh.count} clips.`);
    pollTimer = null; refreshBatches(fresh.name);
  } else if (Date.now() - startedAt > 8 * 3600e3) {
    setState('Run klaar, maar geen nieuwe batch gevonden. Mogelijk leverde de zoekopdracht niets op.');
    pollTimer = null;
  } else {
    setState('Run klaar, batch wordt gepubliceerd…');
    pollTimer = setTimeout(poll, 20000);
  }
}
let startedAt = 0;

$('#start').addEventListener('click', async () => {
  $('#start').disabled = true; setState('Starten…');
  const inputs = {
    preset: $('#f-preset').value, query: $('#f-query').value.trim(),
    max_items: $('#f-items').value, max_files: $('#f-files').value,
    whisper_model: $('#f-model').value, pd_only: $('#f-pd').checked,
  };
  let res, d;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ inputs }) });
    d = await res.json();
  } catch { d = { error: 'Startknop niet bereikbaar. Is de Netlify-functie ingesteld?' }; }
  if (!res || !res.ok || d.error) { setState(d.error || 'Starten mislukt.'); $('#start').disabled = false; return; }
  knownBefore = [...batchNames]; startedAt = Date.now();
  setState('Gestart. Dit duurt meestal 15–30 minuten; je kunt deze pagina open laten of later terugkomen.');
  setTimeout(poll, 15000);
});

firstLoad.then(() => checkRun(true)).then(st => { if (st === 'busy') { knownBefore = [...batchNames]; startedAt = Date.now(); poll(); } });
</script>
</body>
</html>
